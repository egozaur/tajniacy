<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Tajniacy – klucz kapitana</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b2a1e;--card:#fff6e3;--cardb:#d9bf92;--r:#c4472c;--rt:#f6d3c8;--b:#2b6c8c;--bt:#cfe3ec;--n:#d8c29a}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:#f4e6cf;display:flex;flex-direction:column}
.hdr{padding:12px 14px;color:#fff;font-weight:900;font-size:1.2rem;display:flex;justify-content:space-between;align-items:center}
.hdr.r{background:var(--r)}.hdr.b{background:var(--b)}.hdr.x{background:#6a5636}
.board{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:1fr;gap:6px;padding:8px}
.c{border:2px solid;border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;text-transform:uppercase;
  font-size:clamp(9px,2.9vw,17px);padding:2px;overflow-wrap:normal;hyphens:none;line-height:1.1;position:relative;min-height:60px;user-select:none}
.c.r{background:var(--rt);border-color:var(--r);color:#8c2713}
.c.b{background:var(--bt);border-color:var(--b);color:#164a63}
.c.n{background:#f1e3c6;border-color:var(--n);color:#8a7650}
.c.a{background:#241b14;border-color:#000;color:#fff}
.c i{position:absolute;top:1px;right:4px;font-style:normal;font-size:.8em;opacity:.85}
.c.done{opacity:.35;text-decoration:line-through}
.leg{padding:8px 12px 14px;font-size:.85rem;font-weight:700;text-align:center;opacity:.85}
.err{padding:40px 20px;text-align:center;font-weight:800;font-size:1.2rem}
</style>
</head>
<body>
<div id="root"></div>
<script>
const NAME={r:"Czerwoni",b:"Niebiescy"}, G={r:"▲",b:"◆",n:"●",a:"☠"};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function decode(p){
  p=p.replace(/-/g,'+').replace(/_/g,'/'); while(p.length%4) p+='=';
  const bin=atob(p), bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  const s=new TextDecoder().decode(bytes).split('|');
  const key=s.shift().split(''); return {key, words:s};
}
function fitCards(sel){document.querySelectorAll(sel).forEach(el=>{el.style.fontSize='';let fs=parseFloat(getComputedStyle(el).fontSize),n=0;while((el.scrollWidth>el.clientWidth+1||el.scrollHeight>el.clientHeight+1)&&fs>7&&n++<40){fs-=1;el.style.fontSize=fs+'px';}});}
function draw(){
  const root=document.getElementById('root');
  const m=location.hash.slice(1).match(/^([rb])\.(.+)$/);
  if(!m){ root.innerHTML='<div class="hdr x">Tajniacy</div><div class="err">Zeskanuj kod QR od prowadzącego grę, żeby zobaczyć klucz.</div>'; return; }
  try{
    const t=m[1], d=decode(m[2]);
    if(d.words.length!==25||d.key.length!==25) throw 0;
    root.innerHTML=`<div class="hdr ${t}"><span>Kapitan: ${NAME[t]}</span><span>Twoje: ${d.key.filter(k=>k===t).length}</span></div>
    <div class="board">${d.words.map((w,i)=>`<div class="c ${d.key[i]}" data-i="${i}">${esc(w)}<i>${G[d.key[i]]}</i></div>`).join('')}</div>
    <div class="leg">▲ czerwoni · ◆ niebiescy · ● neutralne · ☠ zabójca<br>Dotknij hasło, żeby je przyciemnić (tylko u Ciebie).</div>`;
  }catch(e){ root.innerHTML='<div class="hdr x">Tajniacy</div><div class="err">Nieprawidłowy lub uszkodzony kod. Zeskanuj go ponownie.</div>'; }
}
document.addEventListener('click',e=>{const c=e.target.closest('.c'); if(c) c.classList.toggle('done');});
window.addEventListener('hashchange',draw); window.addEventListener('resize',()=>fitCards('.c')); draw(); fitCards('.c');
</script>
</body>
</html>
