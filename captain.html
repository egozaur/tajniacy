<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Tajniacy – klucz kapitana</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="PL3Y">
<link rel="manifest" href="/site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Special+Elite&family=Bungee&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<script src="/auth.js" data-no-idle></script>
<script src="common.js"></script>
<script src="net.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
#root{display:flex;flex-direction:column;min-height:100dvh}
.hdr{padding:12px 14px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px}
.hdr.r{background:var(--r)}.hdr.b{background:var(--b)}.hdr.x{background:#6a5636;font-weight:900;font-size:1.2rem}
.hdr small{display:block;font-weight:700;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.hdr b{display:block;font-family:var(--hfont);font-size:1.45rem;font-weight:900;line-height:1.1}
.hdr .lf{text-align:right}.hdr .lf b{font-family:'Nunito',system-ui,sans-serif;font-size:2rem}
.turn{padding:6px 12px;text-align:center;font-weight:900;font-size:.95rem;color:#fff}
.turn.r{background:var(--r)}.turn.b{background:var(--b)}
.turn.mine{box-shadow:inset 0 -3px 0 rgba(255,255,255,.6)}
.net{padding:6px 12px;text-align:center;font-weight:800;font-size:.85rem;background:#6a5636;color:#fff}
.tools{display:flex;gap:6px;padding:8px 8px 0;flex-wrap:wrap}
.tools button{flex:1;min-width:0;border:2px solid var(--cardb);background:var(--paper);color:var(--ink);border-radius:10px;padding:.5em .4em;font:inherit;font-weight:800;font-size:.85rem}
.board{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:1fr;gap:6px;padding:8px}
.c{border:2px solid;border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;text-transform:uppercase;
  font-size:clamp(9px,2.9vw,17px);padding:2px;overflow-wrap:normal;hyphens:none;line-height:1.1;position:relative;min-height:60px;user-select:none;cursor:pointer}
.c.r{background:var(--rt);border-color:var(--r);color:var(--rtx)}
.c.b{background:var(--bt);border-color:var(--b);color:var(--btx)}
.c.n{background:var(--nt);border-color:var(--n);color:var(--ntx)}
.c.a{background:var(--at);border-color:#000;color:#fff}
.c i{position:absolute;top:1px;right:4px;font-style:normal;font-size:.8em;opacity:.85}
.c em{position:absolute;top:0;left:3px;font-style:normal;font-size:1.05em}
.c.m1{outline:3px solid var(--accent);outline-offset:1px}
.c.m2{outline:3px dashed var(--accent);outline-offset:1px}
.c.m3{opacity:.32;text-decoration:line-through}
.c.rv{cursor:default}
.leg{padding:8px 12px 14px;font-size:.82rem;font-weight:700;text-align:center;opacity:.85;line-height:1.5}
.err{padding:40px 20px;text-align:center;font-weight:800;font-size:1.2rem}
/* klucz ukryty: plansza jak na ekranie TV – zakryte karty bez kolorów, odkryte w kolorze drużyny */
.c.h{background:var(--card);border-color:var(--cardb);color:var(--ink);cursor:default}
.c.h.r{background:var(--r);border-color:var(--r);color:#fff}
.c.h.b{background:var(--b);border-color:var(--b);color:#fff}
.c.h.n{background:var(--n);border-color:var(--n);color:var(--nrev)}
.c.h.a{background:var(--a);border-color:#000;color:#fff}
.tools button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
</style>
</head>
<body data-theme="noir">
<div id="root"></div>
<script>
/* Dwa formaty kodu QR:
   #<KOD>.<r|b>.<token>  – pokój na serwerze PL3Y: plansza, odkryte karty i kolejne gry przychodzą same,
   #<r|b>.<payload>       – tryb offline: klucz zapisany w adresie, kapitan zaznacza odkryte karty sam. */
const DEF={r:"Czerwoni",b:"Niebiescy"}, G={r:"▲",b:"◆",n:"●",a:"☠"}, MK=['','★','⚠','✓'];
const THEMES=['classic','noir','retro','light'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function decode(p){
  p=p.replace(/-/g,'+').replace(/_/g,'/'); while(p.length%4) p+='=';
  const bin=atob(p), bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  const s=new TextDecoder().decode(bytes).split('|');
  const key=s.shift().split(''), words=s.slice(0,25), ex=s.slice(25);
  return {key, words, names:{r:ex[0]||DEF.r, b:ex[1]||DEF.b}, theme:THEMES.includes(ex[2])?ex[2]:'noir'};
}
const ls={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36);};

let cur=null;      // {t, d, id, revealed?, turn?, winner?}
let marks=[];      // 0..3 na kartę
let hidden=false, dark=ls.get('tj_cdark')==='1';
let live=null;     // {hash, code, t, token, conn, status, view}

function loadMarks(id){ try{ const a=JSON.parse(ls.get('tjm_'+id)||'[]'); marks=Array.from({length:25},(_,i)=>+a[i]||0); }catch(e){ marks=Array(25).fill(0); } }
function saveMarks(){ ls.set('tjm_'+cur.id,JSON.stringify(marks)); }
// W aplikacji PL3Y (ekran główny, pełny ekran) nie ma przycisku Wstecz – dajemy własny powrót do lobby.
const APP=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const HOME=APP?'<button data-a="home" style="flex:0 0 auto">⌂ PL3Y</button>':'';
const shell=(msg,theme)=>{ document.body.dataset.theme=theme||'noir'; document.getElementById('root').innerHTML=`<div class="hdr x">Tajniacy</div>${APP?`<div class="tools">${HOME}</div>`:''}<div class="err">${msg}</div>`; };

/* ---------- tryb na żywo ---------- */
function startLive(code,t,token){
  if(live&&live.hash===location.hash) return;
  if(live&&live.conn) live.conn.stop();
  live={hash:location.hash, code, t, token, status:'connecting', view:null, err:null};
  const me=live;
  me.conn=new TJNET.Conn({ code, hello:()=>({t:'hello',cap:token}),
    onMessage:m=>{
      if(me!==live) return;
      if(m.t==='state'&&m.view){ me.view=m.view; me.err=null; }
      else if(m.t==='error'&&m.code==='badcap'){ me.err='Ten kod kapitana jest nieaktualny. Zeskanuj nowy kod QR z ekranu prowadzącego.'; me.conn.stop('badcap'); }
      draw();
    },
    onStatus:s=>{ if(me!==live) return; me.status=s;
      if(s==='noroom') me.err='Ten pokój już wygasł. Zeskanuj nowy kod QR z ekranu prowadzącego.';
      // nowa plansza = nowe kody: stary klucz znika z ekranu, a nieaktualny kod z adresu (odświeżenie go nie wskrzesi)
      if(s==='revoked'){ me.view=null; me.err='Zaczęła się nowa gra. Zeskanuj nowy kod QR z ekranu prowadzącego.'; }
      draw(); } });
}

function draw(){
  const m=location.hash.slice(1).match(/^([A-Za-z0-9]{5})\.([rb])\.([0-9a-f]{8,64})$/);
  if(m){ startLive(m[1].toUpperCase(),m[2],m[3]); return drawLive(); }
  if(live){ live.conn.stop(); live=null; }
  const o=location.hash.slice(1).match(/^([rb])\.(.+)$/);
  if(!o) return shell('Zeskanuj kod QR od prowadzącego grę, żeby zobaczyć klucz.');
  try{
    const t=o[1], d=decode(o[2]);
    if(d.words.length!==25||d.key.length!==25) throw 0;
    const id=hash(o[2]);
    if(!cur||cur.id!==id){ cur={t,d,id}; loadMarks(id); }
    board();
  }catch(e){ shell('Nieprawidłowy lub uszkodzony kod. Zeskanuj go ponownie.'); }
}

function drawLive(){
  const v=live.view;
  if(live.err) return shell(esc(live.err), v?v.theme:document.body.dataset.theme);
  if(!v) return shell(live.status==='reconnecting'?'Brak połączenia z serwerem. Próbuję ponownie…':'Łączę z grą…');
  if(!v.game) return shell('Połączono jako kapitan drużyny <b>'+esc(v.names[live.t])+'</b>.<br>Czekam na planszę od prowadzącego…', v.theme);
  const g=v.game, id=live.code+'_'+g.id;
  if(!cur||cur.id!==id){ cur={id}; loadMarks(id); }
  Object.assign(cur,{t:live.t, d:{key:g.key, words:g.words, names:v.names, theme:v.theme}, revealed:g.revealed, turn:g.turn, winner:g.winner});
  board();
}

function board(){
  const {t,d}=cur, rv=cur.revealed||[];
  document.body.dataset.theme=dark?'noir':d.theme;
  const mine=d.key.filter(k=>k===t).length;
  const done=d.key.filter((k,i)=>k===t&&(rv[i]||marks[i]===3)).length;
  const mk=i=>rv[i]?3:marks[i];
  let bar='';
  if(live){
    if(cur.winner) bar=`<div class="turn ${cur.winner}">Koniec gry – wygrali ${esc(d.names[cur.winner])}</div>`;
    else if(cur.turn) bar=`<div class="turn ${cur.turn} ${cur.turn===t?'mine':''}">${cur.turn===t?'Twoja kolej – podaj hasło':'Ruch: '+esc(d.names[cur.turn])}</div>`;
    if(live.status!=='online') bar+='<div class="net">Brak połączenia – próbuję ponownie…</div>';
  }
  document.getElementById('root').innerHTML=`<div class="hdr ${t}"><div><small>Jesteś kapitanem drużyny</small><b>${esc(d.names[t])}</b></div><div class="lf"><small>Zostało</small><b>${mine-done}</b></div></div>
  ${bar}
  <div class="tools">${HOME}<button data-a="hide" class="${hidden?'on':''}">${hidden?'🔑 Pokaż klucz':'🙈 Ukryj klucz'}</button><button data-a="dark">${dark?'☀️ Motyw gry':'🌙 Tryb ciemny'}</button>${hidden?'':'<button data-a="clear">↺ Wyczyść znaczniki</button>'}</div>
  <div class="board">${d.words.map((w,i)=>hidden
    // bez klucza: kolor tylko dla kart odkrytych (w trybie offline = oznaczonych ✓), bez symboli i znaczników
    ?`<div class="c h ${mk(i)===3?d.key[i]:''}" data-i="${i}">${esc(w)}</div>`
    :`<div class="c ${d.key[i]} m${mk(i)} ${rv[i]?'rv':''}" data-i="${i}">${esc(w)}<i>${G[d.key[i]]}</i>${mk(i)?`<em>${MK[mk(i)]}</em>`:''}</div>`).join('')}</div>
  <div class="leg">${hidden?'Klucz ukryty – widzisz planszę tak jak na ekranie TV.<br>Dotknij „Pokaż klucz”, żeby wrócić do kolorów.':live?'Odkryte karty oznaczają się same (✓).<br>Dotknij hasło, żeby dodać znacznik (tylko u Ciebie): ★ w mojej podpowiedzi → ⚠ ryzykowne → brak':'Dotknij hasło, żeby zmienić znacznik (tylko u Ciebie):<br>★ w mojej podpowiedzi → ⚠ ryzykowne → ✓ odkryte → brak'}${hidden?'':`<br>▲ ${esc(d.names.r)} · ◆ ${esc(d.names.b)} · ● neutralne · ☠ zabójca`}</div>
  `;
  fitCards('.c');
}

document.addEventListener('click',e=>{
  const a=e.target.closest('[data-a]');
  if(a){ const v=a.dataset.a;
    if(v==='home'){ if(confirm('Wrócić do PL3Y? Do klucza wrócisz, skanując ponownie kod z ekranu.')) location.href='/'; return; }
    if(v==='hide') hidden=!hidden;
    else if(v==='dark'){ dark=!dark; ls.set('tj_cdark',dark?'1':'0'); }
    else if(v==='clear'){ if(marks.some(Boolean) && confirm('Wyczyścić wszystkie znaczniki?')){ marks=Array(25).fill(0); saveMarks(); } }
    draw(); lock(); return; }
  const c=e.target.closest('.c');
  if(c&&cur&&!hidden){
    const i=+c.dataset.i;
    if(cur.revealed&&cur.revealed[i]) return;
    marks[i]=(marks[i]+1)%(live?3:4); saveMarks(); draw(); lock();
  }
});
let wl=null;
async function lock(){ try{ if('wakeLock' in navigator && document.visibilityState==='visible' && (!wl||wl.released)) wl=await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange',lock);
window.addEventListener('hashchange',()=>{ cur=null; draw(); });
window.addEventListener('resize',()=>fitCards('.c'));
draw(); lock();
</script>
</body>
</html>
