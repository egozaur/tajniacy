<style>
/* Tryb dla 2 osób: wygląd z tj.css (jak Tajniacy na TV), tu tylko dodatki. Zielony = agenci (gracie razem). */
:root{--g:#3b8a4f;--gt:#d3ecd8;--gtx:#1f5a2f}
body[data-theme=noir]{--g:#3f9e5c;--gt:#1d3b27;--gtx:#b6f0c8}
body[data-theme=retro]{--g:#22c473;--gt:#17483a;--gtx:#b0ffd6}
body[data-theme=light]{--g:#2a8a4a;--gt:#d8f1df;--gtx:#14532b}

/* plansza: miejsce na pasek hasła */
.top{padding-bottom:0}
.team.g{background:var(--g)}
.team.idle{background:var(--paper);color:var(--ink);border:2px solid var(--cardb)}
.team .rl{font-weight:800;opacity:.9;font-size:min(1.4vw,2.4vh)}
.team .dot{display:inline-block;width:.55em;height:.55em;border-radius:50%;background:#888;margin-left:.35em;vertical-align:middle}
.team .dot.on{background:#7dff9f;box-shadow:0 0 0 .2em rgba(125,255,159,.25)}
.mid .cnt{display:flex;gap:1.4vmin;align-items:baseline;font-weight:900}
.mid .cnt small{font-weight:800;opacity:.75;font-size:.75em}
.cluebar{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:1.2vmin 2.5vmin 0;font-weight:800;min-height:56px}
.cluebar .msg{opacity:.9}
.cluebar .me{color:var(--accent)}
.clue{font-family:var(--hfont);font-weight:900;font-size:min(3vw,5vh);text-transform:uppercase;letter-spacing:.06em;padding:.05em .55em;border-radius:12px;background:var(--ink);color:var(--on-ink);white-space:nowrap}
.cform{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.cform input{width:min(320px,70vw);text-transform:uppercase;font-weight:900;letter-spacing:.04em}
.nums{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.nums button{width:2.4em;height:2.4em;border-radius:10px;border:2px solid var(--cardb);background:var(--paper);font-weight:900;padding:0}
.nums button.on{background:var(--accent);border-color:var(--accent);color:#2a2014}
.board{height:calc(100dvh - 22vh - 64px)}
/* mój klucz na nieodkrytych kartach (jak podgląd klucza po grze na TV) + agent zielony */
.card.hint.k-g .front{background:var(--gt);border-color:var(--g);color:var(--gtx)}
.card.k-g .back{background:radial-gradient(circle at 22% 45%,rgba(255,255,255,.3),rgba(255,255,255,0) 45%),linear-gradient(160deg,rgba(255,255,255,.12),rgba(0,0,0,.3)),var(--g)}
.card.can{cursor:pointer}
.card:not(.can){cursor:default}
/* odkryty agent pamięta, czym był na moim kluczu */
.card .back .g{font-size:.62em}
.card.my-a .back{box-shadow:inset 0 0 0 .55vmin #000}
.card.my-a .back .g{background:#000;color:#fff;border-radius:.3em;padding:.05em .3em;top:.25em;right:.3em;opacity:1}
/* pudła: postronny na kluczu danej osoby */
.marks{position:absolute;left:.4em;bottom:.3em;display:flex;gap:.25em;z-index:2;max-width:calc(100% - .8em)}
.marks i{font-style:normal;font-size:.42em;font-weight:900;letter-spacing:.03em;padding:.1em .45em;border-radius:.4em;background:var(--ink);color:var(--on-ink);opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:none}
.card.dead .front{opacity:.45}
.card.nudge .in{animation:nudge .5s}
@keyframes nudge{0%,100%{transform:none}25%{transform:translateX(-1vmin) rotate(-1.5deg)}60%{transform:translateX(.8vmin) rotate(1deg)}}
.badge.g{background:var(--g)}
.splash.seen .logo span,.splash.seen .stamp,.splash.seen .menu,.splash.seen .row{animation:none;opacity:1}
.fstamp.g{color:var(--g)}
.drop.g .doc::after,.drop.g .stmp{color:var(--g)}
.win.g{color:var(--g)} .win.lose{color:var(--r)}
.foot{padding-top:1.2vmin}
.foot .btn.on{background:var(--accent);color:#2a2014;border-color:var(--accent)}
.foot .danger{border-color:var(--r)}

/* ekran startowy i pokój */
.splash .panel{width:min(520px,100%);text-align:left;margin-top:0}
.splash .menu{opacity:0;animation:fadein .6s ease 1.4s forwards;margin-top:4vmin;display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0}
.or{text-align:center;opacity:.6;font-weight:800;margin:10px 0}
.err{color:var(--rtx);font-weight:800;background:var(--rt);border-radius:10px;padding:.5em .8em}
.setup h1{margin-top:12px}
.setup .tabs{display:flex;gap:8px;margin-top:14px}
.code{font-family:var(--hfont);font-size:2.6rem;font-weight:900;letter-spacing:.2em;line-height:1.1}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media(max-width:560px){.seats{grid-template-columns:1fr}}
.seat{border-radius:14px;padding:12px 14px;font-weight:900;display:flex;align-items:center;gap:10px;min-width:0;background:var(--g);color:#fff}
.seat span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat.empty{background:var(--paper2);color:var(--ink);border:2px dashed var(--cardb);font-weight:700;opacity:.8}
.seat .dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.4);flex:none}
.seat .dot.on{background:#7dff9f;box-shadow:0 0 0 3px rgba(125,255,159,.25)}
.seat.empty .dot{background:var(--cardb)}
.rules{text-align:left}
.rules h3{margin:16px 0 6px;font-size:1.1rem;font-family:var(--hfont)}
.rules p,.rules li{line-height:1.5}
.rules ul{padding-left:1.2em;margin:6px 0}
.ex{display:inline-flex;align-items:center;justify-content:center;min-width:1.6em;height:1.6em;border-radius:6px;font-weight:900;padding:0 .3em;vertical-align:middle;font-size:.9em}
.ex.g{background:var(--g);color:#fff}.ex.a{background:#000;color:#fff}.ex.n{background:var(--nt);border:1px solid var(--cardb)}.ex.x{background:var(--ink);color:var(--on-ink)}
.log{display:flex;flex-direction:column;gap:10px;text-align:left;margin-top:8px}
.log .e{border-left:4px solid var(--cardb);padding-left:10px}
.log .e b{font-family:var(--hfont);text-transform:uppercase}
.log .p{display:inline-block;margin:3px 4px 0 0;padding:0 7px;border-radius:6px;font-weight:800;font-size:.85em}
.p.g{background:var(--g);color:#fff}.p.n{background:var(--nt);color:var(--ntx)}.p.a{background:#000;color:#fff}
.big-w{font-family:var(--hfont);font-weight:900;font-size:2rem;text-transform:uppercase;margin:10px 0}
@media(max-width:700px){
  .board{height:auto}
  .team .rl{font-size:.75rem}
  .team .nm{font-size:1rem}
  .mid{font-size:.9rem}
  .clue{font-size:1.3rem}
  .card .front{padding:.25em}
  .marks i{font-size:.5em}
}
@media (prefers-reduced-motion:reduce){.card.nudge .in,.splash .menu{animation:none;opacity:1}}

<body data-theme="classic">
<div id="fx" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div class="snd"><button id="bmusic" data-act="tmusic" title="Muzyka" aria-label="Muzyka">🎵</button><button id="bsfx" data-act="tsfx" title="Efekty dźwiękowe" aria-label="Efekty dźwiękowe">🔊</button></div>
<script type="module">
/* Tajniacy we dwoje: dwie osoby w osobnych przeglądarkach, wspólna plansza, każdy ma swój klucz.
   Serwer (Durable Object TjDuo w repo pl3y-server: src/games/tajniacy/duo.js) pilnuje zasad i wysyła każdemu tylko jego klucz.
   ?local=1: dev/duo-local.js (SharedWorker) uruchamia ten sam pokój lokalnie, bez Cloudflare. ?slot=N: osobne miejsce na kartę. */
const API = 'https://pl3y-server.pl3y.workers.dev';

// Token sesji PL3Y: wydaje go serwer po podaniu hasła w bramce (/auth.js), tu tylko go odczytujemy.
// Do zapytań HTTP idzie nagłówkiem Authorization, do WebSocketu parametrem ?tok= (przeglądarka nie ustawi nagłówka).
const plToken = () => { try { const t = localStorage.getItem('pl3y_token'); return t && Number(localStorage.getItem('pl3y_token_exp')) > Date.now() ? t : ''; } catch (e) { return ''; } };
const authHead = (h = {}) => { const t = plToken(); return t ? { ...h, Authorization: 'Bearer ' + t } : h; };
const wsTok = () => { const t = plToken(); return t ? '?tok=' + encodeURIComponent(t) : ''; };
// Serwer odrzucił sesję (401): pokaż bramkę hasła.
const onAuthFail = r => { if (r.status === 401 && window.PL3Y && window.PL3Y.expired) window.PL3Y.expired(); };
const Q = new URLSearchParams(location.search);
const LOCAL = Q.has('local');
const SLOT = Q.get('slot') || '';
const TURNS = [[9, '9 tur'], [11, '11 tur'], [0, 'Bez limitu']];

const ls = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} },
};
const seatKey = code => `tjduo_${LOCAL ? 'l' : 'p'}${SLOT}_${code}`;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $app = document.getElementById('app');

// Motyw i własna lista haseł z głównych Tajniaków (ta sama przeglądarka), inaczej wbudowane kategorie.
const TJ = (() => { try { return JSON.parse(ls.get('tajniacy_v1') || '{}').config || {}; } catch (e) { return {}; } })();
document.body.dataset.theme = TJ.theme || 'classic';
function parseWords(text) {
  const cats = []; let cur = null;
  for (const raw of String(text || '').split('\n')) {
    const line = raw.trim(); if (!line) continue;
    if (line.startsWith('#')) { cur = { name: line.replace(/^#+\s*/, '') || 'Ogólne', words: [] }; cats.push(cur); continue; }
    if (!cur) { cur = { name: 'Ogólne', words: [] }; cats.push(cur); }
    line.split(',').map(s => s.trim()).filter(Boolean).forEach(w => cur.words.push(w));
  }
  return cats.filter(c => c.words.length);
}
const CATS = TJ.text ? parseWords(TJ.text) : Object.entries(DEFAULTS).map(([name, v]) => ({ name, words: v.split(' ') }));
function selCats() { try { const s = JSON.parse(ls.get('tjduo_cats') || 'null'); return Array.isArray(s) ? s : null; } catch (e) { return null; } }
function pool() {
  const sel = selCats(), seen = new Set(), out = [];
  CATS.filter(c => !sel || sel.includes(c.name)).forEach(c => c.words.forEach(w => { const k = w.toLowerCase(); if (!seen.has(k)) { seen.add(k); out.push(w); } }));
  return out;
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ---------- połączenie (WebSocket albo lokalny SharedWorker) ----------
let port = null, cidSeq = 0, ridSeq = 0;
const socks = new Map(), waits = new Map();
function localPort() {
  if (port) return port;
  const w = new SharedWorker(new URL('dev/duo-local.js', location.href), { type: 'module', name: 'tjduo-dev' });
  port = w.port;
  port.onmessage = ({ data: m }) => {
    if (m.rid && waits.has(m.rid)) { const f = waits.get(m.rid); waits.delete(m.rid); return f(m); }
    const s = socks.get(m.cid); if (!s) return;
    if (m.t === 'open') { s.readyState = 1; s.onopen && s.onopen(); }
    else if (m.t === 'msg') s.onmessage && s.onmessage({ data: m.data });
    else if (m.t === 'close') { s.readyState = 3; socks.delete(m.cid); s.onclose && s.onclose({ code: m.code }); }
  };
  port.start();
  setInterval(() => { for (const [cid, s] of socks) if (s.readyState === 1) port.postMessage({ t: 'send', cid, data: '{"t":"ping"}' }); }, 4000);
  return port;
}
class LocalSocket {
  constructor(code) { this.cid = ++cidSeq; this.readyState = 0; socks.set(this.cid, this); localPort().postMessage({ t: 'connect', cid: this.cid, code }); }
  send(d) { port.postMessage({ t: 'send', cid: this.cid, data: d }); }
  close() { if (this.readyState > 1) return; this.readyState = 3; socks.delete(this.cid); port.postMessage({ t: 'close', cid: this.cid }); }
}
async function createRoom() {
  if (LOCAL) {
    const m = await new Promise(res => { const rid = ++ridSeq; waits.set(rid, res); localPort().postMessage({ t: 'api', rid, body: { method: 'POST', path: '/api/tj/duo/rooms' } }); });
    if (m.status >= 300) throw new Error('HTTP ' + m.status);
    return m.json;
  }
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 8000);
  try {
    const r = await fetch(API + '/api/tj/duo/rooms', { method: 'POST', signal: ctl.signal, headers: authHead() });
    onAuthFail(r);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

// Sam się wita (tokenem albo nickiem), wznawia po zerwaniu i ponawia niepotwierdzony ruch.
class Conn {
  constructor(code, name) {
    this.code = code; this.name = name;
    this.ws = null; this.status = ''; this.retry = 0; this.lastMsg = 0; this.stopped = false;
    this.pending = null; this.seq = 0;
    this.connect();
    this.beat = setInterval(() => this.heartbeat(), 15000);
    addEventListener('online', () => this.kick());
    document.addEventListener('visibilitychange', () => { if (!document.hidden) this.kick(); });
  }
  setStatus(s) { if (this.status !== s) { this.status = s; onStatus(s); } }
  hello() { const h = { t: 'hello' }, tok = ls.get(seatKey(this.code)); if (tok) h.player = tok; if (this.name) h.join = this.name; return h; }
  connect() {
    if (this.stopped) return;
    this.setStatus(this.retry ? 'reconnecting' : 'connecting');
    let ws;
    try { ws = LOCAL ? new LocalSocket(this.code) : new WebSocket(API.replace(/^http/, 'ws') + '/api/tj/duo/rooms/' + encodeURIComponent(this.code) + '/ws' + wsTok()); }
    catch (e) { return this.later(); }
    this.ws = ws;
    ws.onopen = () => { this.retry = 0; this.lastMsg = Date.now(); this.raw(this.hello()); };
    ws.onmessage = e => {
      this.lastMsg = Date.now();
      let m; try { m = JSON.parse(e.data); } catch (_) { return; }
      if (m.t === 'pong') return;
      if (m.t === 'welcome') { ls.set(seatKey(this.code), m.token); this.setStatus('online'); if (this.pending) this.raw(this.pending); return; }
      if (m.t === 'state') { this.setStatus('online'); this.pending = null; return onState(m.view); }
      if (m.t === 'error') {
        if (m.code === 'noroom') { ls.set(seatKey(this.code), null); return this.stop('noroom'); }
        if (m.code === 'full') return this.stop('full');
        if (m.code === 'badplayer') { ls.set(seatKey(this.code), null); if (this.name) return this.raw(this.hello()); return this.stop('needname'); }
        if (m.code === 'move') this.pending = null;
        return toast(m.err || 'Błąd');
      }
    };
    ws.onclose = e => { if (this.ws !== ws) return; this.ws = null; if (e && e.code === 4404) return this.stop('noroom'); this.later(); };
    ws.onerror = () => {};
  }
  later() {
    if (this.stopped) return;
    this.setStatus('reconnecting');
    const delay = Math.min(8000, 400 * 2 ** this.retry++) * (0.75 + Math.random() * 0.5);
    clearTimeout(this.rt); this.rt = setTimeout(() => this.connect(), delay);
  }
  kick() { if (this.stopped) return; if (!this.ws || this.ws.readyState > 1) { clearTimeout(this.rt); this.retry = 0; this.connect(); } else this.heartbeat(); }
  heartbeat() {
    if (!this.ws || this.ws.readyState !== 1) return;
    if (Date.now() - this.lastMsg > 40000) { const w = this.ws; try { w.close(); } catch (e) {} if (w.onclose) w.onclose({ code: 1006 }); return; }
    this.raw({ t: 'ping' });
  }
  raw(obj) { if (this.ws && this.ws.readyState === 1) { this.ws.send(JSON.stringify(obj)); return true; } return false; }
  send(obj) { return this.raw(obj); }
  move(act) { const m = { t: 'move', id: Date.now().toString(36) + '-' + (++this.seq), act }; this.pending = m; if (!this.raw(m)) toast('Brak połączenia: ruch pójdzie po powrocie sieci.'); }
  stop(reason) {
    this.stopped = true; clearTimeout(this.rt); clearInterval(this.beat);
    this.setStatus(reason || 'closed');
    if (this.ws) { const w = this.ws; this.ws = null; try { w.close(); } catch (e) {} }
  }
}

// ---------- stan widoku ----------
let conn = null;
const ui = { scr: 'menu', tab: 'room', code: '', view: null, status: '', showKey: true, keyOf: 'me', endShown: '', clue: '', n: 1, err: '', busy: false, splashSeen: false };
let prevG = null;          // poprzedni widok gry (do efektów: co się zmieniło)
let fresh = new Set(), nudge = new Set(), boomFresh = false, holdEnd = 0;
const GLY = { g: '▲', a: '☠', n: '●' };
const FIT_SEL = '.card .front, .card .lab';

function codeFromHash() { const c = decodeURIComponent(location.hash.slice(1)).toUpperCase().replace(/[^A-Z0-9]/g, ''); return c.length === 5 ? c : ''; }
const inviteUrl = code => location.origin + location.pathname + (LOCAL ? '?local=1' : '') + '#' + code;
const sameGame = (a, b) => !!(a && b && a.words.join('|') === b.words.join('|'));
// Ta sama reguła co na serwerze (duo-engine.js clashWord): to samo słowo albo jedno zawiera drugie.
function clashWord(words, clue) {
  const c = String(clue).toLocaleLowerCase('pl');
  return words.find(w => { const x = w.toLocaleLowerCase('pl'); return x === c || x.includes(c) || c.includes(x); }) || null;
}

function join(code, name) {
  if (conn) conn.stop('closed');
  ui.code = code; ui.view = null; ui.err = ''; ui.scr = 'room'; ui.tab = 'room'; prevG = null;
  if (location.hash.slice(1) !== code) history.replaceState(null, '', location.pathname + location.search + '#' + code);
  conn = new Conn(code, name);
  render();
}
function onStatus(s) {
  ui.status = s;
  if (s === 'noroom') { ui.scr = 'menu'; ui.err = 'Taki pokój nie istnieje albo wygasł.'; history.replaceState(null, '', location.pathname + location.search); }
  if (s === 'full') { ui.scr = 'menu'; ui.err = 'Pokój jest pełny: grają już dwie osoby.'; }
  if (s === 'needname') ui.scr = 'nick';
  if (s === 'online' || s === 'reconnecting' || s === 'connecting') { const el = document.getElementById('netst'); if (el) { el.outerHTML = netBadge(); return; } }
  render();
}
const isMine = (g, seat) => g && g.phase !== 'end' && ((g.phase === 'clue' && g.giver === seat) || (g.phase === 'guess' && g.giver !== seat));

function onState(v) {
  const g = v.game, old = sameGame(prevG, g) ? prevG : null;
  fresh = new Set(); nudge = new Set(); boomFresh = false;
  if (g && !old) { ui.keyOf = 'me'; ui.clue = ''; ui.n = 1; ui.endShown = ''; holdEnd = 0; closeDlg(); }
  if (g && old) {
    g.found.forEach((f, i) => { if (f && !old.found[i]) fresh.add(i); });
    [0, 1].forEach(s => g.miss[s].forEach((m, i) => { if (m && !old.miss[s][i]) nudge.add(i); }));
    if (fresh.size) { Snd.play('flip'); setTimeout(() => Snd.play('r'), 300); }
    if (nudge.size) { Snd.play('flip'); setTimeout(() => Snd.play('neutral'), 300); }
    if (g.phase === 'end' && old.phase !== 'end') {
      const r = g.result;
      Snd.hush(true);
      if (r.reason === 'assassin') { boomFresh = true; holdEnd = Date.now() + 2900; setTimeout(() => assassinScene(r.card), 20); }
      else if (r.win) { holdEnd = Date.now() + 1400; setTimeout(() => { Snd.play('win'); celebrate('g'); }, 1100); }
      else { holdEnd = Date.now() + 500; Snd.play('bad'); }
    } else if (g.phase !== 'end' && g.turnNo !== old.turnNo) {
      setTimeout(() => { if (ui.view && ui.view.game && ui.view.game.turnNo === g.turnNo) { Snd.play('turn'); turnBanner(g, v.seat); } }, fresh.size || nudge.size ? 1150 : 80);
    } else if (g.phase === 'guess' && old.phase === 'clue') Snd.play('stamp');
  } else if (g && !old && ui.view && g.phase !== 'end') {
    setTimeout(() => { Snd.play('turn'); turnBanner(g, v.seat); }, 200);     // nowa gra na oczach graczy
  }
  if (g && g.phase !== 'end') { Snd.hush(false); Snd.tension(g.foundCount >= g.total - 3 || (g.turns > 0 && g.turnNo >= g.turns)); }
  else Snd.tension(false);
  if (g && g.phase !== 'end') {
    const mine = isMine(g, v.seat);
    if (mine && old && !isMine(old, v.seat)) toast(g.phase === 'clue' ? 'Twoja kolej: podaj hasło' : `Zgadujesz: ${g.clue.word} · ${g.clue.n}`);
    document.title = (mine ? '● ' : '') + 'Tajniacy we dwoje';
  } else document.title = 'Tajniacy we dwoje';
  ui.view = v; prevG = g;
  render();
}

  } else {

function render() {
  const a = document.activeElement, fid = a && a.id && a.tagName === 'INPUT' ? a.id : null;

  const vals = {}; document.querySelectorAll('#app input[type=text]').forEach(el => { if (el.id && el.id !== 'clue') vals[el.id] = el.value; });
  const inGame = ui.scr === 'room' && ui.view && ui.view.game;
  if (!inGame) document.querySelectorAll('.scar').forEach(e => e.remove());
  let html;
  if (ui.scr === 'menu') html = menuView();
  else if (ui.scr === 'nick') html = nickView();
  else if (inGame) html = gameView();

  if (ui.scr === 'menu' || ui.scr === 'nick') ui.splashSeen = true;
  for (const [id, val] of Object.entries(vals)) { const el = document.getElementById(id); if (el) el.value = val; }
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
  const g = inGame && ui.view.game;

    const key = g.words.join('|') + ':' + ui.view.games;

  }
  // animacje tylko raz: kolejne przebudowy (np. przełączenie klucza) już ich nie powtarzają
  fresh = new Set(); nudge = new Set(); boomFresh = false;
  fitCards(FIT_SEL);
}

  document.body.appendChild(dlgEl);

}
function closeDlg() { if (dlgEl) { dlgEl.remove(); dlgEl = null; } }
function ask(title, body, okText) {
  return new Promise(res => {
    closeDlg();
    const o = document.createElement('div'); o.className = 'ov';
    o.innerHTML = `<div class="dlg" role="dialog" aria-modal="true"><h2>${esc(title)}</h2>${body || ''}<div class="row"><button class="btn" data-v="0">Anuluj</button><button class="btn pri" data-v="1">${esc(okText)}</button></div></div>`;
    const done = v => { o.remove(); removeEventListener('keydown', key, true); res(v); };
    const key = e => { if (e.key === 'Escape') { e.preventDefault(); done(false); } else if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); done(true); } };
    o.addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b) done(b.dataset.v === '1'); else if (e.target === o) done(false); });
    addEventListener('keydown', key, true);
    document.body.appendChild(o);
    o.querySelector('[data-v="1"]').focus();
  });
}
let toastT;
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800); }
function updateSndUi() { const m = document.getElementById('bmusic'), f = document.getElementById('bsfx'); if (m) m.classList.toggle('off', !Snd.st.m); if (f) f.classList.toggle('off', !Snd.st.s); }

// ---------- akcje ----------
function nickOk() {
  const el = document.getElementById('nick'), n = (el ? el.value : '').replace(/\s+/g, ' ').trim().slice(0, 16);
  if (!n) { toast('Wpisz swój nick'); if (el) el.focus(); return null; }
  ls.set('tjduo_nick', n); return n;
}
function startWords() {
  const p = pool();
  if (p.length < 25) { toast('Za mało haseł w wybranych kategoriach (min. 25)'); return null; }
  return shuffle(p).slice(0, 25);
}
const acts = {
  async lobby() { if (ui.view && ui.view.game && ui.view.game.phase !== 'end' && !(await ask('Wrócić do lobby PL3Y?', '<p>Gra zostanie w pokoju: wrócisz tym samym linkiem.</p>', 'Wróć do lobby'))) return; location.href = '/'; },
  tv() { location.href = './'; },
  async create() {
    const n = nickOk(); if (!n) return;
    ui.busy = true; ui.err = ''; render();
    try { const r = await createRoom(); ui.busy = false; join(r.code, n); }
    catch (e) { ui.busy = false; ui.err = 'Nie udało się założyć pokoju. Sprawdź internet i spróbuj jeszcze raz.'; render(); }
  },
  joincode() {
    const n = nickOk(); if (!n) return;
    const c = (document.getElementById('jcode').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (c.length !== 5) return toast('Kod pokoju ma 5 znaków');
    join(c, n);
  },
  joinnick() { const n = nickOk(); if (n) join(ui.code, n); },
  tab(d) { ui.tab = d.v; render(); },
  rules() { showDlg(`<div class="ov" data-act="closeend"><div class="dlg wide rules" role="dialog" aria-modal="true">${rulesHtml()}<div class="row"><button class="btn pri" data-act="closeend">Zamknij</button></div></div></div>`); },
  log() { showDlg(logDlg(ui.view.game)); },
  async copy() {
    const url = inviteUrl(ui.code);
    try { await navigator.clipboard.writeText(url); toast('Link skopiowany: wyślij go ziomkowi'); }
    catch (e) { prompt('Skopiuj link:', url); }
  },
  turns(d) { conn.send({ t: 'cfg', turns: Number(d.v) }); },
  cat(d, el) {
    let sel = selCats() || CATS.map(c => c.name);
    sel = el.checked ? [...new Set([...sel, d.n])] : sel.filter(x => x !== d.n);
    ls.set('tjduo_cats', sel.length === CATS.length ? null : JSON.stringify(sel));
    render();
  },
  start() { const w = startWords(); if (w) conn.send({ t: 'start', words: w }); },
  again() { closeDlg(); const w = startWords(); if (w) conn.send({ t: 'start', words: w }); },
  num(d) { ui.n = Number(d.v); render(); const el = document.getElementById('clue'); if (el) el.focus(); },
  clue() {
    const el = document.getElementById('clue'), w = (el ? el.value : '').trim();
    if (!w) { toast('Wpisz hasło'); if (el) el.focus(); return; }
    if (/\s/.test(w)) return toast('Hasło to jedno słowo, bez spacji');
    const hit = clashWord(ui.view.game.words, w);
    if (hit) { toast(`Nie można: „${hit}” jest na planszy`); if (el) { el.focus(); el.select(); } return; }
    conn.move({ a: 'clue', word: w, n: ui.n }); ui.clue = '';
  },
  async pick(d) {
    const g = ui.view.game, i = Number(d.i);
    if (await ask('Odsłonić to hasło?', `<div class="big-w">${esc(g.words[i])}</div><p class="note">Sprawdzi się według klucza: ${esc(g.names[g.giver])}.</p>`, 'Odsłoń')) {
      const cur = ui.view.game;
      if (cur.phase === 'guess' && cur.giver === g.giver && !cur.found[i]) conn.move({ a: 'guess', i });
    }
  },
  nop() {
    const g = ui.view && ui.view.game; if (!g || g.phase === 'end') return;
    if (g.phase === 'clue') toast(g.giver === ui.view.seat ? 'Najpierw podaj hasło' : 'Poczekaj na hasło');
    else if (g.giver === ui.view.seat) toast('Teraz zgaduje ' + g.names[1 - g.giver]);
  },
  async endturn() { if (await ask('Zakończyć turę?', '<p>Role się zamienią.</p>', 'Koniec tury')) conn.move({ a: 'end' }); },
  async surrender() { if (await ask('Poddać się?', '<p>Gra skończy się przegraną dla was obojga.</p>', 'Poddaję się')) conn.move({ a: 'surrender' }); },
  togglekey() { ui.showKey = !ui.showKey; render(); },
  keyof(d) { ui.keyOf = d.v; render(); },
  showend() { showDlg(endDlg(ui.view.game)); },
  closeend(d, el, e) { if (e.target === el || el.tagName === 'BUTTON') closeDlg(); },
  tmusic() { Snd.setMusic(!Snd.st.m); updateSndUi(); },
  tsfx() { Snd.setSfx(!Snd.st.s); updateSndUi(); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.dataset.act === 'cat') return;
  const f = acts[el.dataset.act]; if (f) f(el.dataset, el, e);
});
document.addEventListener('pointerdown', () => Snd.unlock(), { once: true });
document.addEventListener('change', e => { const el = e.target.closest('[data-act="cat"]'); if (el) acts.cat(el.dataset, el); });
document.addEventListener('input', e => {
  if (e.target.id !== 'clue') return;
  const el = e.target;
  if (/\s/.test(el.value)) { const p = el.selectionStart; el.value = el.value.replace(/\s+/g, ''); try { el.setSelectionRange(p - 1, p - 1); } catch (_) {} toast('Hasło to jedno słowo, bez spacji'); }
  ui.clue = el.value;
});
document.addEventListener('keydown', e => {
  if (!e.target.id) return;
  if (e.target.id === 'clue' && (e.key === ' ' || e.key === 'Spacebar')) { e.preventDefault(); toast('Hasło to jedno słowo, bez spacji'); return; }
  if (e.key !== 'Enter') return;
  if (e.target.id === 'clue') acts.clue();
  else if (e.target.id === 'jcode') acts.joincode();
  else if (e.target.id === 'nick') ui.scr === 'nick' ? acts.joinnick() : acts.create();
});
addEventListener('hashchange', () => { const c = codeFromHash(); if (c && c !== ui.code) boot(); });
addEventListener('resize', () => { fitCards(FIT_SEL); document.querySelectorAll('.scar').forEach(e => e.remove()); });

// lekka paralaksa planszy i tła oraz przechylenie karty pod kursorem (tylko mysz, tylko karty do kliknięcia)
let hovCard = null;
function unhover() { if (!hovCard) return; hovCard.classList.remove('hov'); ['--rx', '--ry', '--gx', '--gy'].forEach(p => hovCard.style.removeProperty(p)); hovCard = null; }
document.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse' || calm()) return;
  const x = e.clientX / innerWidth - 0.5, y = e.clientY / innerHeight - 0.5, root = document.documentElement.style;
  root.setProperty('--px', (-x * 1.2).toFixed(3) + 'vmin'); root.setProperty('--py', (-y * 1.2).toFixed(3) + 'vmin');
  const c = e.target.closest && e.target.closest('.board .card.can');
  if (hovCard && hovCard !== c) unhover();
  if (!c || document.querySelector('.ov')) { unhover(); return; }
  hovCard = c;
  const r = c.getBoundingClientRect(), u = (e.clientX - r.left) / r.width, v = (e.clientY - r.top) / r.height;
  c.classList.add('hov');
  c.style.setProperty('--rx', ((0.5 - v) * 14).toFixed(2) + 'deg'); c.style.setProperty('--ry', ((u - 0.5) * 14).toFixed(2) + 'deg');
  c.style.setProperty('--gx', (u * 100).toFixed(1) + '%'); c.style.setProperty('--gy', (v * 100).toFixed(1) + '%');
});
document.documentElement.addEventListener('mouseleave', () => unhover());

function boot() {
  const c = codeFromHash();
  if (!c) { ui.scr = 'menu'; return render(); }
  ui.code = c;
  if (ls.get(seatKey(c))) return join(c, ls.get('tjduo_nick') || '');
  ui.scr = 'nick'; render();
  setTimeout(() => { const el = document.getElementById('nick'); if (el) el.focus(); }, 0);
}
updateSndUi();
boot();
</script>
