var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  //---------------------------------------------------------------------
  // QRUtil
  //---------------------------------------------------------------------

  var QRUtil = function() {

    var PATTERN_POSITION_TABLE = [
      [],
      [6, 18],
      [6, 22],
      [6, 26],
      [6, 30],
      [6, 34],
      [6, 22, 38],
      [6, 24, 42],
      [6, 26, 46],
      [6, 28, 50],

/* ---------- narzędzia ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $app = document.getElementById('app');
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
let toastT;
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); }
function ask(title, okText, extra){
  return new Promise(res=>{
    const o=document.createElement('div'); o.className='ov';
    o.innerHTML=`<div class="dlg"><h2>${esc(title)}</h2>${extra?`<p>${esc(extra)}</p>`:''}<div class="row"><button class="btn" data-v="0">Anuluj</button><button class="btn pri" data-v="1">${esc(okText||'OK')}</button></div></div>`;
    o.addEventListener('click',e=>{const b=e.target.closest('[data-v]'); if(b||e.target===o){o.remove(); res(!!b&&b.dataset.v==='1');}});
    document.body.appendChild(o);
  });
}
function parseWords(text){
  const cats=[]; let cur=null;
  for(const raw of String(text||'').split('\n')){
    const line=raw.trim(); if(!line) continue;
    if(line.startsWith('#')){ cur={name:line.replace(/^#+\s*/,'')||'Ogólne',words:[]}; cats.push(cur); continue; }
    if(!cur){ cur={name:'Ogólne',words:[]}; cats.push(cur); }
    line.split(',').map(s=>s.trim()).filter(Boolean).forEach(w=>cur.words.push(w));
  }
  return cats.filter(c=>c.words.length);
}

/* ---------- stan ---------- */
let store=null, local=false;
let config={ text:null, cats:null, players:[], baseUrl:"" };
let game=null;
let ui={ screen:'board', draftText:null, loaded:{config:false,game:false} };
const hashMode = () => location.hash==='#czerwony' ? 'r' : location.hash==='#niebieski' ? 'b' : null;
let me = hashMode();

function makeLocalStore(){
  const KEY='tajniacy_v1', subs={}; let data={};
  try{ data=JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch(e){ data={}; }
  return {
    sub(name,cb){ (subs[name]=subs[name]||[]).push(cb); setTimeout(()=>cb(data[name]||null),0); },
    set(name,obj){ data[name]=JSON.parse(JSON.stringify(obj)); try{ localStorage.setItem(KEY,JSON.stringify(data)); }catch(e){} (subs[name]||[]).forEach(cb=>cb(data[name])); return Promise.resolve(); }
  };
}
function makeDbStore(db){
  const queues={};
  return {
    sub(name,cb){
      db.doc("app/"+name).onSnapshot(s=>{
        let d=null;
        if(s){ d = typeof s.data==='function' ? s.data() : s.data; if(s.exists===false) d=null; }
        cb(d||null);
      }, err=>{ console.error(err); cb(null); });
    },
    set(name,obj){
      const clean=JSON.parse(JSON.stringify(obj));
      queues[name]=(queues[name]||Promise.resolve()).then(()=>db.doc("app/"+name).set(clean)).catch(e=>{console.error(e); toast("Nie udało się zapisać (brak uprawnień?)");});
      return queues[name];
    }
  };
}

/* ---------- logika gry ---------- */
function activeWords(){
  const cats=parseWords(config.text==null?DEFAULT_TEXT:config.text);
  const sel=config.cats;
  const seen=new Set(), out=[];
  cats.filter(c=>!sel||sel.includes(c.name)).forEach(c=>c.words.forEach(w=>{const k=w.toLowerCase(); if(!seen.has(k)){seen.add(k); out.push(w);}}));
  return out;
}
async function newGame(){
  const pool=activeWords();
  if(pool.length<25){ toast("Za mało haseł w wybranych kategoriach (min. 25)"); return false; }
  const words=shuffle(pool).slice(0,25);
  const start=Math.random()<.5?'r':'b';
  const key=shuffle([].concat(Array(9).fill(start),Array(8).fill(other(start)),Array(7).fill('n'),['a']));
  game={ id:Date.now(), words, key, revealed:Array(25).fill(false), start, turn:start, winner:null };
  ui.screen='board'; ui.qr=true; render();
  await store.set('game',game);
  return true;
}
async function reveal(i,actor){
  if(!game||game.winner||game.revealed[i]) return;
  const g=JSON.parse(JSON.stringify(game));
  g.revealed[i]=true; const k=g.key[i];
  if(k==='a') g.winner=other(actor);
  else{
    if(k==='r'||k==='b'){ const left=g.key.filter((x,j)=>x===k&&!g.revealed[j]).length; if(left===0) g.winner=k; }
    if(!g.winner && k!==actor) g.turn=other(actor);
  }
  game=g; if(k==='a') shakeNext=true; render(); if(g.winner&&ui.confId!==g.id){ ui.confId=g.id; confetti(); } await store.set('game',g);
}
async function endTurn(){
  if(!game||game.winner) return;
  game={...game,turn:other(game.turn)}; render(); await store.set('game',game);
}
const left = k => game ? game.key.filter((x,j)=>x===k&&!game.revealed[j]).length : 0;
const captainOf = t => (config.players||[]).find(p=>p.t===t&&p.c);
function saveConfig(){ return store.set('config',config); }

/* ---------- QR ---------- */
function baseUrl(){ return BASE_URL || config.baseUrl || ""; }
function qrSvg(url){
  try{ const q=qrcode(0,'M'); q.addData(url); q.make(); return q.createSvgTag({cellSize:4,margin:0,scalable:true}); }catch(e){ return ""; }
}
function payload(){
  const s=game.key.join('')+'|'+game.words.join('|');
  let bin=''; new TextEncoder().encode(s).forEach(b=>bin+=String.fromCharCode(b));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function capUrl(t){ const b=baseUrl().split('#')[0]; return b && game ? b+'#'+t+'.'+payload() : ''; }
function qrBox(t){
  const url=capUrl(t);
  const cp=captainOf(t);
  return `<div class="qrbox ${t}"><h3>Kapitan: ${esc(TEAMS[t].name)}</h3><div>${cp?esc(cp.n):'<i>(kapitan niewybrany)</i>'}</div>
    <div class="q">${url?qrSvg(url):'<small style="color:#333">Najpierw wpisz adres strony kapitana w Ustawieniach</small>'}</div></div>`;
}
function qrOverlay(){
  return `<div class="ov"><div class="dlg" style="max-width:900px"><h2>Kody dla kapitanów</h2>
  <div class="qrs">${qrBox('r')}${qrBox('b')}</div>
  <p class="note">Każdy kapitan skanuje tylko swój kod. Zamknij okno, gdy obaj mają klucz.</p>
  <div class="row"><button class="btn pri big" data-act="closeqr">Gotowe, zamknij</button></div></div></div>`;
}

/* ---------- widoki ---------- */
let lastId=null, lastRev=null, shakeNext=false;
function cardHtml(i,view){
  const k=game.key[i], rev=game.revealed[i];
  const fresh = rev && lastId===game.id && lastRev && lastRev[i]===false;
  const showKey = view==='cap' || !!game.winner;
  let cls='card'; if(rev) cls+=' rev k-'+k+(fresh?' flip':''); else if(showKey) cls+=' hint k-'+k;
  const g=(rev||showKey)?`<span class="g">${GLYPH[k]}</span>`:'';
  return `<button class="${cls}" data-act="card" data-i="${i}">${esc(game.words[i])}${g}</button>`;
}
function hostBoard(){
  if(!game) return `<div class="wait"><h1>Tajniacy</h1><p>Nie ma jeszcze rozpoczętej gry.</p><p><button class="btn pri big" data-act="setup">Ustawienia i start</button></p></div>`;
  const tb=t=>{const c=captainOf(t); return `<div class="team ${t} ${game.turn===t&&!game.winner?'active':''}"><div><div class="nm">${TEAMS[t].name}</div><div class="cp">${c?'Kapitan: '+esc(c.n):''}</div></div><div class="num">${left(t)}</div></div>`;};
  let html=`${local?'<div class="banner">Tryb lokalny – telefony kapitanów nie zobaczą tej gry (brak połączenia z bazą)</div>':''}
  <div class="top">${tb('r')}<div class="mid"><span class="badge ${game.turn}">Ruch: ${TEAMS[game.turn].name}</span><button class="btn sm" data-act="endturn">Koniec tury</button></div>${tb('b')}</div>
  <div class="board ${shakeNext?'shake':''}">${game.words.map((_,i)=>cardHtml(i,'host')).join('')}</div>
  <div class="foot"><button class="btn sm" data-act="newgame">Nowa gra</button><button class="btn sm" data-act="qr">Kody QR kapitanów</button><button class="btn sm" data-act="setup">Ustawienia</button></div>`;
  if(ui.qr) html+=qrOverlay();
  if(game.winner) html+=`<div class="ov"><div class="dlg"><div>Koniec gry</div><div class="win ${game.winner}">Wygrywają<br>${TEAMS[game.winner].name}!</div><div class="row"><button class="btn pri big" data-act="newgame2">Nowa gra</button><button class="btn" data-act="closewin">Pokaż planszę</button></div></div></div>`;
  lastId=game.id; lastRev=game.revealed.slice(); shakeNext=false;
  return html;
}
function confetti(){
  const cols=['#c4472c','#2b6c8c','#f2c94c','#6a994e','#fff6e3'];
  for(let i=0;i<70;i++){ const d=document.createElement('div'); d.className='conf';
    d.style.left=Math.random()*100+'vw'; d.style.background=cols[i%cols.length];
    d.style.animationDuration=(2.2+Math.random()*2.2)+'s'; d.style.animationDelay=(Math.random()*.8)+'s';
    document.body.appendChild(d); setTimeout(()=>d.remove(),6000); }
}
function captainView(){
  const t=me;
  if(!game) return `<div class="cap"><div class="hdr ${t}"><b>Kapitan: ${TEAMS[t].name}</b></div><div class="wait">Czekamy na start gry…</div></div>`;
  const c=captainOf(t);
  let html=`<div class="cap"><div class="hdr ${t}"><b>Kapitan: ${TEAMS[t].name}${c?' – '+esc(c.n):''}</b><span>Zostało: <b>${left(t)}</b></span></div>
  <div class="sub"><span>Ruch: <b>${TEAMS[game.turn].name}</b>${game.turn===t?' (Wasz!)':''}</span><button class="btn sm" data-act="endturn">Koniec tury</button></div>
  <div class="board">${game.words.map((_,i)=>cardHtml(i,'cap')).join('')}</div>
  <div class="sub" style="font-size:.85rem;opacity:.8">▲ czerwoni · ◆ niebiescy · ● neutralne · ☠ zabójca. Dotknij hasła, żeby je odkryć.</div>`;
  if(game.winner) html+=`<div class="ov"><div class="dlg"><div>Koniec gry</div><div class="win ${game.winner}">Wygrywają<br>${TEAMS[game.winner].name}!</div></div></div>`;
  return html+`</div>`;
}
function setupView(){
  const cats=parseWords(ui.draftText!=null?ui.draftText:(config.text==null?DEFAULT_TEXT:config.text));
  const sel=config.cats;
  const pl=config.players||[];
  const team=t=>pl.map((p,i)=>({p,i})).filter(x=>x.p.t===t).map(({p,i})=>`<span class="chip ${p.c?'cp':''}">${esc(p.n)}<button class="${p.c?'on':''}" title="Kapitan" data-act="cap" data-i="${i}">★</button><button title="Usuń" data-act="del" data-i="${i}">✕</button></span>`).join('')||'<i>pusto</i>';
  return `<div class="setup"><h1>Tajniacy – ustawienia</h1>
  ${local?'<div class="banner" style="border-radius:10px;margin-top:8px">Tryb lokalny: brak połączenia z bazą – telefony nie zsynchronizują się.</div>':''}
  <div class="panel"><h2>1. Gracze i kapitanowie</h2>
    <div class="row"><input type="text" id="pname" placeholder="Imię (może być kilka po przecinku)" style="flex:1;min-width:200px">
      <button class="btn r sm" data-act="add" data-t="r">+ Czerwoni</button><button class="btn b sm" data-act="add" data-t="b">+ Niebiescy</button></div>
    <div class="cols" style="margin-top:10px"><div class="tcol r"><h3>Czerwoni</h3>${team('r')}</div><div class="tcol b"><h3>Niebiescy</h3>${team('b')}</div></div>
    <div class="row"><button class="btn sm" data-act="rndteams">🎲 Wylosuj podział drużyn</button><button class="btn sm" data-act="rndcap">🎲 Wylosuj kapitanów</button></div>
    <div class="note">Kapitana wskazujesz gwiazdką ★ (ręcznie) albo losujesz przyciskiem.</div></div>
  <div class="panel"><h2>2. Kategorie haseł w tej grze</h2>
    <div class="cats">${cats.map(c=>`<label><input type="checkbox" data-act="cat" data-n="${esc(c.name)}" ${(!sel||sel.includes(c.name))?'checked':''}>${esc(c.name)} (${c.words.length})</label>`).join('')}</div>
    <div class="row"><button class="btn sm" data-act="catall">Zaznacz wszystkie</button></div></div>
  <div class="panel"><h2>3. Lista haseł</h2>
    <div class="note" style="margin:0 0 8px">Format: linia zaczynająca się od # to nazwa kategorii, pod nią hasła – jedno w linii albo po przecinku. Edytuj do woli.</div>
    <textarea id="wtext" spellcheck="false">${esc(ui.draftText!=null?ui.draftText:(config.text==null?DEFAULT_TEXT:config.text))}</textarea>
    <div class="row"><button class="btn sm pri" data-act="savewords">Zapisz hasła</button><button class="btn sm" data-act="resetwords">Przywróć domyślne</button></div></div>
  <div class="row" style="margin-top:18px"><button class="btn pri big" data-act="start">▶ Start nowej gry</button>${game?'<button class="btn" data-act="back">Wróć do planszy</button>':''}</div></div>`;
}
function render(){
  const m=hashMode(); me=m;
  if(!ui.loaded.config||!ui.loaded.game){ $app.innerHTML='<div class="wait">Ładowanie…</div>'; return; }
  if(me) $app.innerHTML=captainView();
  else if(ui.screen==='setup') { const y=window.scrollY; $app.innerHTML=setupView(); window.scrollTo(0,y); }
  else $app.innerHTML=hostBoard();
  fitCards('.card');
}
function fitCards(sel){document.querySelectorAll(sel).forEach(el=>{el.style.fontSize='';let fs=parseFloat(getComputedStyle(el).fontSize),n=0;while((el.scrollWidth>el.clientWidth+1||el.scrollHeight>el.clientHeight+1)&&fs>7&&n++<40){fs-=1;el.style.fontSize=fs+'px';}});}
window.addEventListener('resize',()=>fitCards('.card'));
function syncDraft(){ const t=document.getElementById('wtext'); if(t) ui.draftText=t.value; }

/* ---------- zdarzenia ---------- */
document.addEventListener('input',e=>{ if(e.target.id==='wtext') ui.draftText=e.target.value; });
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='pname'){ const c=(config.players||[]); const nr=c.filter(p=>p.t==='r').length, nb=c.filter(p=>p.t==='b').length; addPlayers(nr<=nb?'r':'b'); }});
function addPlayers(t){
  const inp=document.getElementById('pname'); if(!inp) return;
  const names=inp.value.split(',').map(s=>s.trim()).filter(Boolean); if(!names.length) return;
  config.players=(config.players||[]).concat(names.map(n=>({n,t,c:false})));
  saveConfig(); render();
}
const acts={
  async card(d){
    if(!game||game.winner) return;
    const i=+d.i; if(game.revealed[i]) return;
    const actor = me || game.turn;
    if(me && game.turn!==me){ toast("Teraz ruch drużyny: "+TEAMS[game.turn].name); return; }
    if(await ask("Odkryć hasło „"+game.words[i]+"”?","Tak, odkryj")) reveal(i,actor);
  },
  async endturn(){ if(await ask("Zakończyć turę?","Tak")) endTurn(); },
  setup(){ ui.screen='setup'; render(); },
  back(){ syncDraft(); ui.screen='board'; render(); },
  async newgame(){ if(await ask("Rozpocząć nową grę?","Tak, nowa gra","Obecna plansza zostanie zastąpiona.")) newGame(); },
  newgame2(){ newGame(); },
  qr(){ ui.qr=true; render(); },
  closeqr(){ ui.qr=false; render(); },
  closewin(){ game={...game,_hide:true}; /* tylko lokalnie */ document.querySelector('.ov')?.remove(); },
  add(d){ addPlayers(d.t); },
  del(d){ config.players.splice(+d.i,1); saveConfig(); render(); },
  cap(d){ const p=config.players[+d.i]; const was=p.c; config.players.forEach(x=>{ if(x.t===p.t) x.c=false; }); p.c=!was; saveConfig(); render(); },
  rndteams(){ const names=shuffle(config.players||[]).map(p=>p.n); config.players=names.map((n,i)=>({n,t:i%2?'b':'r',c:false})); saveConfig(); render(); },
  rndcap(){ ['r','b'].forEach(t=>{ const m=config.players.filter(p=>p.t===t); m.forEach(p=>p.c=false); if(m.length) m[Math.floor(Math.random()*m.length)].c=true; }); saveConfig(); render(); },
  saveurl(){ const v=document.getElementById('burl').value.trim().split('#')[0]; config.baseUrl=v; saveConfig(); render(); },
  cat(d,el){
    const all=parseWords(ui.draftText!=null?ui.draftText:(config.text==null?DEFAULT_TEXT:config.text)).map(c=>c.name);
    let sel=config.cats||all.slice();
    if(el.checked){ if(!sel.includes(d.n)) sel.push(d.n); } else sel=sel.filter(x=>x!==d.n);
    config.cats=sel; saveConfig();
  },
  catall(){ config.cats=null; saveConfig(); render(); },
  savewords(){ syncDraft(); config.text=ui.draftText; config.cats=null; ui.draftText=null; saveConfig(); render(); toast("Zapisano hasła"); },
  resetwords(){ ui.draftText=null; config.text=null; config.cats=null; saveConfig(); render(); },
  async start(){ syncDraft(); if(ui.draftText!=null){ config.text=ui.draftText; ui.draftText=null; saveConfig(); } await newGame(); }
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el||el.type==='checkbox') return;
  const f=acts[el.dataset.act]; if(f) f(el.dataset,el);
});
document.addEventListener('change',e=>{ const el=e.target.closest('[data-act="cat"]'); if(el) acts.cat(el.dataset,el); });
window.addEventListener('hashchange',render);

/* ---------- start ---------- */
const PASS_HASH="6104da49c1ed7c94f9ced9e7135e31cc69aabf88f5bce50a2e73bb56a602e417";
async function sha(x){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('tajniacy:'+x)); return [...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join(''); }
function gate(){
  return new Promise(async res=>{
    try{ if(localStorage.getItem('tj_ok')===PASS_HASH) return res(); }catch(e){}
    const o=document.createElement('div'); o.className='ov'; o.style.background='#f4e6cf';
    o.innerHTML='<form class="dlg"><h2>Tajniacy</h2><p>Podaj hasło</p><div class="row"><input type="password" id="gpw" autocomplete="current-password" style="width:70%"><button class="btn pri" type="submit">Wejdź</button></div><p id="gerr" class="note" style="color:#c4472c"></p></form>';
    document.body.appendChild(o); document.getElementById('gpw').focus();
    o.querySelector('form').addEventListener('submit',async e=>{
      e.preventDefault();
      if(await sha(document.getElementById('gpw').value)===PASS_HASH){ try{localStorage.setItem('tj_ok',PASS_HASH);}catch(_){} o.remove(); res(); }
      else{ document.getElementById('gerr').textContent='Złe hasło'; }
    });
  });
}
(async function init(){
  await gate();
  store=makeLocalStore(); local=false;
  store.sub('config',d=>{
    if(d){ config={ text:null, cats:null, players:[], baseUrl:"", ...d }; }
    const first=!ui.loaded.config; ui.loaded.config=true;
    if(first || ui.screen!=='setup') render();
  });
  store.sub('game',d=>{
    if(d && game && JSON.stringify(d)===JSON.stringify(game) && ui.loaded.game) return;
    game=d; ui.loaded.game=true;
    if(ui.screen!=='setup' || me) render();
  });
  setTimeout(()=>{ if(!ui.loaded.config||!ui.loaded.game){ ui.loaded.config=ui.loaded.game=true; render(); } },10000);
})();
</script>
