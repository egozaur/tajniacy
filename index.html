var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2

        switch (c) {

        case '$' : return 37;
        case '%' : return 38;
        case '*' : return 39;

  //---------------------------------------------------------------------
  // base64EncodeOutputStream
  //---------------------------------------------------------------------

  var base64EncodeOutputStream = function() {

    var _buffer = 0;
    var _buflen = 0;

    var _base64 = '';

    var _this = {};

    var writeEncoded = function(b) {
      _base64 += String.fromCharCode(encode(b & 0x3f) );

    var encode = function(n) {
      if (n < 0) {
        // error.
      } else if (n < 26) {
        return 0x41 + n;
      } else if (n < 52) {
        return 0x61 + (n - 26);
      } else if (n < 62) {
        return 0x30 + (n - 52);
      } else if (n == 62) {
        return 0x2b;
      } else if (n == 63) {

    };

    _this.writeByte = function(n) {

      _buffer = (_buffer << 8) | (n & 0xff);

      _length += 1;

      while (_buflen >= 6) {
        writeEncoded(_buffer >>> (_buflen - 6) );
        _buflen -= 6;

    };

    _this.flush = function() {

      if (_buflen > 0) {

  //---------------------------------------------------------------------
  // base64DecodeInputStream
  //---------------------------------------------------------------------

  var base64DecodeInputStream = function(str) {

    var _str = str;
    var _pos = 0;

    var _buflen = 0;

    var _this = {};

    _this.read = function() {

      while (_buflen < 8) {

        if (_pos >= _str.length) {
          if (_buflen == 0) {
            return -1;

        } else if (c.match(/^\s$/) ) {

        _buflen += 6;

    };

    var decode = function(c) {
      if (0x41 <= c && c <= 0x5a) {
        return c - 0x41;
      } else if (0x61 <= c && c <= 0x7a) {
        return c - 0x61 + 26;
      } else if (0x30 <= c && c <= 0x39) {
        return c - 0x30 + 52;
      } else if (c == 0x2b) {
        return 62;
      } else if (c == 0x2f) {
        return 63;
      } else {
        throw 'c:' + c;
      }
    };

  //---------------------------------------------------------------------
  // gifImage (B/W)
  //---------------------------------------------------------------------

  var gifImage = function(width, height) {

    var _width = width;
    var _height = height;

    var _this = {};

    _this.setPixel = function(x, y, pixel) {

    _this.write = function(out) {

      //---------------------------------
      // GIF Signature

      out.writeString('GIF87a');

      //---------------------------------
      // Screen Descriptor

      out.writeShort(_width);
      out.writeShort(_height);

      out.writeByte(0x80); // 2bit
      out.writeByte(0);
      out.writeByte(0);

      //---------------------------------
      // Global Color Map

      // black
      out.writeByte(0x00);
      out.writeByte(0x00);
      out.writeByte(0x00);

      // white
      out.writeByte(0xff);
      out.writeByte(0xff);
      out.writeByte(0xff);

      //---------------------------------
      // Image Descriptor

      out.writeString(',');
      out.writeShort(0);
      out.writeShort(0);
      out.writeShort(_width);
      out.writeShort(_height);
      out.writeByte(0);

      //---------------------------------
      // Local Color Map

      //---------------------------------
      // Raster Data

      var lzwMinCodeSize = 2;
      var raster = getLZWRaster(lzwMinCodeSize);

      out.writeByte(lzwMinCodeSize);

      var offset = 0;

      while (raster.length - offset > 255) {
        out.writeByte(255);

      out.writeByte(raster.length - offset);

      table.add(String.fromCharCode(endCode) );

      bitOut.write(clearCode, bitLength);

      var dataIndex = 0;

      var s = String.fromCharCode(_data[dataIndex]);
      dataIndex += 1;

        var c = String.fromCharCode(_data[dataIndex]);
        dataIndex += 1;

        } else {

          bitOut.write(table.indexOf(s), bitLength);

          if (table.size() < 0xfff) {

            }

            table.add(s + c);
          }

          s = c;
        }

      bitOut.write(table.indexOf(s), bitLength);

      };

      _this.size = function() {
        return _size;
      };

      _this.indexOf = function(key) {
        return _map[key];
      };

    };

    return _this;
  };

  var createDataURL = function(width, height, getPixel) {
    var gif = gifImage(width, height);

    var b = byteArrayOutputStream();

    var bytes = b.toByteArray();

<body>
<div id="fx" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div id="app"><div class="wait">Ładowanie…</div></div>
<div id="toast"></div>
<div class="snd"><button id="bmusic" data-act="tmusic" title="Muzyka">🎵</button><button id="bsfx" data-act="tsfx" title="Efekty dźwiękowe">🔊</button></div>
<script>
/* ---------- stałe i dane domyślne ---------- */
const BASE_URL = "https://pl3y.pl/tajniacy/captain.html";
const LOBBY_BTN = '<button class="btn sm tolobby" data-act="lobby">← Lobby</button>';
const TEAMS = { r:{name:"Czerwoni"}, b:{name:"Niebiescy"} };
const GLYPH = { r:"▲", b:"◆", n:"●", a:"☠" };
const PRESETS=[['Czerwoni','Niebiescy'],['Policja','Mafia'],['Szpiedzy','Kontrwywiad'],['Lisy','Wilki'],['Smoki','Rycerze'],['Piraci','Marynarka']];
const THEMES=[['classic','Klasyczny'],['noir','Noir'],['retro','Retro neon'],['light','Jasny']];
const other = t => t==='r' ? 'b' : 'r';
const tn = t => (config.names&&config.names[t]) || TEAMS[t].name;



const DEFAULT_TEXT = Object.entries(DEFAULTS).map(([k,v]) => "# "+k+"\n"+v.split(" ").join("\n")).join("\n\n");

/* ---------- narzędzia ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $app = document.getElementById('app');
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
let toastT;
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); }
function ask(title, okText, extra){
  return new Promise(res=>{
    const o=document.createElement('div'); o.className='ov';
    o.innerHTML=`<div class="dlg"><h2>${esc(title)}</h2>${extra?`<p>${esc(extra)}</p>`:''}<div class="row"><button class="btn" data-v="0">Anuluj</button><button class="btn pri" data-v="1">${esc(okText||'OK')}</button></div></div>`;
    o.addEventListener('click',e=>{const b=e.target.closest('[data-v]'); if(b||e.target===o){o.remove(); res(!!b&&b.dataset.v==='1');}});
    document.body.appendChild(o);
  });
}
function parseWords(text){
  const cats=[]; let cur=null;
  for(const raw of String(text||'').split('\n')){
    const line=raw.trim(); if(!line) continue;
    if(line.startsWith('#')){ cur={name:line.replace(/^#+\s*/,'')||'Ogólne',words:[]}; cats.push(cur); continue; }
    if(!cur){ cur={name:'Ogólne',words:[]}; cats.push(cur); }
    line.split(',').map(s=>s.trim()).filter(Boolean).forEach(w=>cur.words.push(w));
  }
  return cats.filter(c=>c.words.length);
}

/* ---------- stan ---------- */
let store=null;
let config={ text:null, cats:null, players:[], baseUrl:"", names:{}, theme:"noir", match:0, assassins:1, score:{r:0,b:0} };
let game=null;
let ui={ screen:'board', draftText:null, splash:true, loaded:{config:false,game:false} };

function makeLocalStore(){
  const KEY='tajniacy_v1', subs={}; let data={};
  try{ data=JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch(e){ data={}; }
  return {
    sub(name,cb){ (subs[name]=subs[name]||[]).push(cb); setTimeout(()=>cb(data[name]||null),0); },
    set(name,obj){ data[name]=JSON.parse(JSON.stringify(obj)); try{ localStorage.setItem(KEY,JSON.stringify(data)); }catch(e){} (subs[name]||[]).forEach(cb=>cb(data[name])); return Promise.resolve(); }
  };
}

/* ---------- logika gry ---------- */
function activeWords(){
  const cats=parseWords(config.text==null?DEFAULT_TEXT:config.text);
  const sel=config.cats;
  const seen=new Set(), out=[];
  cats.filter(c=>!sel||sel.includes(c.name)).forEach(c=>c.words.forEach(w=>{const k=w.toLowerCase(); if(!seen.has(k)){seen.add(k); out.push(w);}}));
  return out;
}
const assassinCount = () => Math.min(3,Math.max(1,+config.assassins||1));
async function newGame(){
  const pool=activeWords();
  if(pool.length<25){ toast("Za mało haseł w wybranych kategoriach (min. 25)"); return false; }
  const words=shuffle(pool).slice(0,25);
  const start=Math.random()<.5?'r':'b';
  const na=assassinCount();
  const key=shuffle([].concat(Array(9).fill(start),Array(8).fill(other(start)),Array(8-na).fill('n'),Array(na).fill('a')));
  game={ id:Date.now(), words, key, revealed:Array(25).fill(false), start, turn:start, winner:null, turnCount:1, hits:{r:0,b:0}, miss:{r:0,b:0} };
  ensureRoom();
  ui.screen='board'; ui.qr=true; ui.winHold=false; ui.hideWin=null; Snd.hush(false); render();
  await store.set('game',game);
  return true;
}
async function reveal(i,actor){
  if(!game||game.winner||game.revealed[i]) return;
  const g=JSON.parse(JSON.stringify(game));
  g.revealed[i]=true; const k=g.key[i];
  g.hits=g.hits||{r:0,b:0}; g.miss=g.miss||{r:0,b:0}; g.turnCount=g.turnCount||1;
  g.lastWord=g.words[i]; g.lastBy=actor; g.lastKey=k;
  if(k===actor) g.hits[actor]++; else g.miss[actor]++;
  let changed=false;
  if(k==='a') g.winner=other(actor);
  else{
    if(k==='r'||k==='b'){ const left=g.key.filter((x,j)=>x===k&&!g.revealed[j]).length; if(left===0) g.winner=k; }
    if(!g.winner && k!==actor){ g.turn=other(actor); g.turnCount++; changed=true; }
  }
  if(g.winner){ g.endedAt=Date.now(); config.score=config.score||{r:0,b:0}; config.score[g.winner]=(config.score[g.winner]||0)+1; ui.winHold=true; }
  game=g; if(k==='a') shakeNext=true;
  Snd.play('flip');
  if(k==='r'||k==='b') setTimeout(()=>Snd.play(k===actor?k:'bad'),300);
  else if(k==='n') setTimeout(()=>Snd.play('neutral'),300);
  render();
  if(g.winner){
    Snd.hush(true);
    const id=g.id, hold=k==='a'?2900:1400;
    setTimeout(()=>{ if(!game||game.id!==id) return; saveConfig(); ui.winHold=false; Snd.play('win'); if(ui.confId!==id){ ui.confId=id; celebrate(g.winner); } render(); },hold);
  } else if(changed){
    setTimeout(()=>{ if(game&&!game.winner){ Snd.play('turn'); turnBanner(game.turn); } },1150);
  }
  await store.set('game',g);
}
async function endTurn(){
  if(!game||game.winner) return;
  game={...game,turn:other(game.turn),turnCount:(game.turnCount||1)+1}; render();
  Snd.play('turn'); turnBanner(game.turn);
  await store.set('game',game);
}
/* ---------- zapisane gry ----------
   Lista w localStorage „tajniacy_saves”: [{id, name, ts, game, cfg}], najnowsze pierwsze.
   Gra zapisana (game.saveId) aktualizuje swój zapis sama przy każdym ruchu – patrz syncSave(). */
const SAVES_KEY='tajniacy_saves', SAVES_MAX=50, PEND_KEY='tajniacy_saves_pending';
const SAVE_CFG=['players','names','theme','match','score','assassins'];
function loadSaves(){ try{ const a=JSON.parse(localStorage.getItem(SAVES_KEY)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function writeSaves(a){
  try{ localStorage.setItem(SAVES_KEY,JSON.stringify(a.slice(0,SAVES_MAX))); return true; }
  catch(e){ toast("Nie udało się zapisać – brak miejsca w przeglądarce"); return false; }
}
/* Wspólne zapisy na serwerze PL3Y. localStorage to pamięć podręczna, a zmiany, których nie udało się wysłać,
   czekają w kolejce {put:[id], del:[id]} i idą przy następnej okazji (np. przy otwarciu listy). */
function loadPend(){ try{ const p=JSON.parse(localStorage.getItem(PEND_KEY)||'{}')||{}; return {put:p.put||[],del:p.del||[]}; }catch(e){ return {put:[],del:[]}; } }
function writePend(p){ try{ localStorage.setItem(PEND_KEY,JSON.stringify(p)); }catch(e){} }
function pend(op,id){ const p=loadPend(), o=op==='put'?'del':'put'; p[o]=p[o].filter(x=>x!==id); if(!p[op].includes(id)) p[op].push(id); writePend(p); }
let flushing=null;
function flushSaves(){
  if(flushing) return flushing;
  flushing=(async()=>{
    const p=loadPend();
    for(const id of [...p.put]){
      const s=loadSaves().find(x=>x.id===id);
      if(s) await TJNET.api('PUT','/api/tj/saves/'+id,s);
      const q=loadPend(); q.put=q.put.filter(x=>x!==id); writePend(q);
    }
    for(const id of [...p.del]){
      await TJNET.api('DELETE','/api/tj/saves/'+id);
      const q=loadPend(); q.del=q.del.filter(x=>x!==id); writePend(q);
    }
  })().finally(()=>{ flushing=null; });
  return flushing;
}
function putSave(id){ pend('put',id); flushSaves().catch(()=>{}); }
function delSave(id){ writeSaves(loadSaves().filter(x=>x.id!==id)); pend('del',id); flushSaves().catch(()=>{}); }
// Pobiera listę z serwera (po wysłaniu zaległych zmian). true = lista aktualna, false = brak połączenia.
async function refreshSaves(){
  try{
    await flushSaves();
    const list=await TJNET.api('GET','/api/tj/saves');
    const p=loadPend(), local=loadSaves();
    const keep=local.filter(s=>p.put.includes(s.id));
    const merged=[...keep,...list.filter(s=>!p.put.includes(s.id)&&!p.del.includes(s.id))].sort((a,b)=>b.ts-a.ts);
    writeSaves(merged);
    return true;
  }catch(e){ return false; }
}
// jednorazowo: zapisy sprzed serwera trafiają na wspólną listę
function migrateSaves(){
  try{
    if(localStorage.getItem('tajniacy_saves_up')) return;
    loadSaves().forEach(s=>pend('put',s.id));
    localStorage.setItem('tajniacy_saves_up','1');
  }catch(e){}
}
function saveCfg(){ const c={}; SAVE_CFG.forEach(k=>c[k]=JSON.parse(JSON.stringify(config[k]??null))); return c; }
function saveGame(name){
  if(!game) return;
  const a=loadSaves(), old=a.find(s=>s.id===game.saveId);
  const id=old?old.id:Date.now();
  game={...game,saveId:id,saveName:name};
  const entry={id,name,ts:Date.now(),game:JSON.parse(JSON.stringify(game)),cfg:saveCfg()};
  if(!writeSaves([entry,...a.filter(s=>s.id!==id)])) return;
  putSave(id);
  store.set('game',game); render();
  toast(`Zapisano „${name}” – kolejne ruchy zapiszą się same`);
}
let syncT=null;
function syncSave(){
  if(!game||!game.saveId) return;
  const a=loadSaves(), s=a.find(x=>x.id===game.saveId); if(!s) return;
  const g=JSON.stringify(game), c=saveCfg();
  if(JSON.stringify(s.game)===g && JSON.stringify(s.cfg)===JSON.stringify(c)) return;
  s.game=JSON.parse(g); s.cfg=c; s.ts=Date.now();
  writeSaves([s,...a.filter(x=>x!==s)]);
  pend('put',s.id);
  clearTimeout(syncT); syncT=setTimeout(()=>flushSaves().catch(()=>{}),1000);
}
const unsavedGame = () => !!(game && !game.winner && !game.saveId);
function saveStatus(s){
  const g=s.game, nm=t=>(s.cfg&&s.cfg.names&&s.cfg.names[t])||TEAMS[t].name;
  const lf=t=>g.key.filter((x,j)=>x===t&&!g.revealed[j]).length;
  const d=new Date(s.ts).toLocaleString('pl-PL',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'});
  const st=g.winner?`wygrali ${nm(g.winner)}`:`ruch: ${nm(g.turn)} · zostało ${lf('r')} : ${lf('b')}`;
  return `${d} · ${nm('r')} vs ${nm('b')} · ${st}`;
}
function savesDialog(){
  const o=document.createElement('div'); o.className='ov';
  let net='load';     // load | ok | off
  const draw=()=>{
    const a=loadSaves();
    const info=net==='load'?'<p class="note">Pobieram listę z serwera…</p>'
      :net==='off'?'<p class="note">Brak połączenia z serwerem – pokazuję zapisy z tego urządzenia. Zmiany wyślą się później.</p>'
      :'<p class="note">Zapisy są wspólne dla wszystkich urządzeń PL3Y.</p>';
    o.innerHTML=`<div class="dlg wide"><h2>Zapisane gry</h2>${info}${a.length
      ?`<div class="saves">${a.map(s=>`<div class="save ${game&&game.saveId===s.id?'cur':''}"><div class="si"><b>${esc(s.name)}</b><small>${esc(saveStatus(s))}</small></div>
          <button class="btn sm pri" data-sv="load" data-id="${s.id}">Wczytaj</button><button class="btn sm" data-sv="del" data-id="${s.id}" title="Usuń zapis" aria-label="Usuń zapis ${esc(s.name)}">✕</button></div>`).join('')}</div>`
      :'<p class="note">Nie masz jeszcze zapisanych gier. Zapiszesz grę przyciskiem „Zapisz grę” pod planszą.</p>'}
      <div class="row"><button class="btn" data-sv="close">Zamknij</button></div></div>`;
  };
  o.addEventListener('click',async e=>{
    if(e.target===o){ o.remove(); return; }
    const b=e.target.closest('[data-sv]'); if(!b) return;
    if(b.dataset.sv==='close'){ o.remove(); return; }
    const s=loadSaves().find(x=>x.id===+b.dataset.id); if(!s) return draw();
    if(b.dataset.sv==='del'){
      if(await ask(`Usunąć zapis „${s.name}”?`,"Tak, usuń","Zapis zniknie ze wszystkich urządzeń.")){ delSave(s.id); draw(); }
    } else if(b.dataset.sv==='load'){
      if(unsavedGame() && !(await ask(`Wczytać „${s.name}”?`,"Tak, wczytaj","Obecna gra nie jest zapisana i zostanie zastąpiona."))) return;
      o.remove();
      config={...config,...s.cfg}; game={...s.game,saveId:s.id,saveName:s.name};
      ui.splash=false; ui.screen='board'; ui.qr=!game.winner&&needQr(); ui.winHold=false; ui.hideWin=null; Snd.hush(false);
      render(); saveConfig(); store.set('game',game);
      toast(`Wczytano „${s.name}”`);
    }
  });
  o.addEventListener('keydown',e=>{ if(e.key==='Escape') o.remove(); });
  document.body.appendChild(o); draw();
  refreshSaves().then(ok=>{ net=ok?'ok':'off'; if(o.isConnected) draw(); });
}
function askText(title, okText, value){
  return new Promise(res=>{
    const o=document.createElement('div'); o.className='ov';
    o.innerHTML=`<form class="dlg"><h2>${esc(title)}</h2><p><input type="text" maxlength="40" value="${esc(value||'')}" aria-label="Nazwa" style="width:100%"></p><div class="row"><button class="btn" type="button" data-v="0">Anuluj</button><button class="btn pri" type="submit">${esc(okText)}</button></div></form>`;
    const inp=o.querySelector('input'), done=v=>{ o.remove(); res(v); };
    o.addEventListener('click',e=>{ if(e.target===o||e.target.closest('[data-v]')) done(null); });
    o.addEventListener('keydown',e=>{ if(e.key==='Escape') done(null); });
    o.querySelector('form').addEventListener('submit',e=>{ e.preventDefault(); const v=inp.value.trim(); if(v) done(v); else inp.focus(); });
    document.body.appendChild(o); inp.focus(); inp.select();
  });
}

const left = k => game ? game.key.filter((x,j)=>x===k&&!game.revealed[j]).length : 0;
const captainOf = t => (config.players||[]).find(p=>p.t===t&&p.c);
function saveConfig(){ return store.set('config',config); }

/* ---------- QR ---------- */
function baseUrl(){ return BASE_URL || config.baseUrl || ""; }
function qrSvg(url){
  try{ const q=qrcode(0,'M'); q.addData(url); q.make(); return q.createSvgTag({cellSize:4,margin:0,scalable:true}); }catch(e){ return ""; }
}
function payload(){
  const nm=x=>String(x||'').replace(/\|/g,'/').slice(0,16);
  const s=game.key.join('')+'|'+game.words.join('|')+'|'+nm(tn('r'))+'|'+nm(tn('b'))+'|'+(config.theme||'noir');
  let bin=''; new TextEncoder().encode(s).forEach(b=>bin+=String.fromCharCode(b));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
/* ---------- pokój na serwerze PL3Y ----------
   Ekran prowadzącego jest źródłem prawdy: po każdej zmianie wysyła grę do pokoju, a serwer rozsyła ją
   telefonom kapitanów. Pokój ({code, hostToken, cap:{r,b}, capGame}) zostaje na kolejne gry, ale przy każdej
   nowej planszy (game.id ≠ capGame) prowadzący wysyła `rotate`: serwer wydaje nowe kody kapitanów i rozłącza
   stare telefony, żeby poprzedni kapitan nie zobaczył nowego klucza. capGame = gra, dla której wydano kody.
   Bez serwera gra działa dalej, a kody QR przechodzą na stary format z kluczem w adresie (bez śledzenia kart). */
const ROOM_KEY='tajniacy_room';
const Net={ room:null, conn:null, status:'off', caps:{r:0,b:0}, creating:null, failedAt:0 };
try{ Net.room=JSON.parse(localStorage.getItem(ROOM_KEY)||'null'); }catch(e){}
function saveRoom(){ try{ Net.room?localStorage.setItem(ROOM_KEY,JSON.stringify(Net.room)):localStorage.removeItem(ROOM_KEY); }catch(e){} }
function roomCfg(){ return {names:{r:tn('r'),b:tn('b')}, theme:config.theme||'noir'}; }
const freshCaps = () => !!(Net.room && (!game || Net.room.capGame===game.id));
function pushRoom(){ if(Net.conn&&Net.status==='online') Net.conn.send({t:'set', game:game||null, cfg:roomCfg(), rotate:!freshCaps()}); }
function dropRoom(){ if(Net.conn) Net.conn.stop(); Net.conn=null; Net.room=null; Net.caps={r:0,b:0}; saveRoom(); }
function connectRoom(){
  if(Net.conn) Net.conn.stop();
  const room=Net.room;
  Net.conn=new TJNET.Conn({ code:room.code, hello:()=>({t:'hello',host:room.hostToken}),
    onMessage:m=>{
      if(m.t==='welcome'){ Net.status='online'; pushRoom(); }
      else if(m.t==='state'&&m.caps){ Net.caps=m.caps; }
      else if(m.t==='caps'&&m.cap&&Net.room===room){ room.cap=m.cap; room.capGame=m.gameId; saveRoom(); }
      else if(m.t==='error'&&m.code==='badhost'){ dropRoom(); }
      if((m.t==='state'||m.t==='caps')&&ui.qr) render();
      updNet();
    },
    onStatus:s=>{
      Net.status=s;
      if(s==='noroom'&&Net.room===room){   // pokój wygasł: nowy pokój i nowe kody
        dropRoom();
        ensureRoom().then(r=>{ if(r&&game&&!game.winner){ ui.qr=true; render(); } });
      }
      updNet();
    } });
}
// Zwraca pokój (zakłada go, jeśli trzeba) albo null bez serwera. Po nieudanej próbie czeka 20 s.
function ensureRoom(){
  if(Net.room) return Promise.resolve(Net.room);
  if(Net.creating) return Net.creating;
  if(Date.now()-Net.failedAt<20000) return Promise.resolve(null);
  Net.creating=TJNET.createRoom().then(r=>{
    Net.room={code:r.code, hostToken:r.hostToken, cap:r.cap, capGame:game?game.id:null}; saveRoom(); connectRoom(); return Net.room;
  }).catch(()=>{ Net.failedAt=Date.now(); return null; }).finally(()=>{ Net.creating=null; if(ui.qr) render(); updNet(); });
  return Net.creating;
}
// Kody QR pokazujemy przy każdej nowej planszy: kody kapitanów zmieniają się z każdą grą.
const needQr = () => !!game && !game.winner;
function netBadge(){
  const on=Net.room&&Net.status==='online', c=Net.caps||{};
  const txt=!Net.room?'○ offline':on?`● online · kapitanowie ${(c.r?1:0)+(c.b?1:0)}/2`:'○ łączę…';
  return `<span id="netst" class="netst ${on?'on':''}" title="Połączenie z serwerem PL3Y (telefony kapitanów)">${txt}</span>`;
}
function updNet(){ const el=document.getElementById('netst'); if(el) el.outerHTML=netBadge(); }

function capUrl(t){
  const b=baseUrl().split('#')[0]; if(!b) return '';
  if(Net.room) return freshCaps() ? b+'#'+Net.room.code+'.'+t+'.'+Net.room.cap[t] : '';   // stare kody już nie działają – czekamy na nowe
  return game ? b+'#'+t+'.'+payload() : '';
}
function qrBox(t){
  const url=Net.creating?'':capUrl(t);
  const cp=captainOf(t), on=Net.room&&Net.caps&&Net.caps[t];
  return `<div class="qrbox ${t}"><h3>Kapitan: ${esc(tn(t))}</h3><div>${cp?esc(cp.n):'<i>(kapitan niewybrany)</i>'}${on?' · <b>połączony ✓</b>':''}</div>
    <div class="q">${url?qrSvg(url):'<small style="color:#333">Łączę z serwerem…</small>'}</div></div>`;
}
function qrOverlay(){
  if(!Net.room&&!Net.creating) ensureRoom();
  const note=Net.room
    ?'Każdy kapitan skanuje tylko swój kod. Odkryte karty pojawią się na telefonach same. Przy każdej nowej planszy kody się zmieniają, a stare telefony tracą dostęp do klucza.'
    :Net.creating?'Zakładam pokój na serwerze…'
    :'Brak połączenia z serwerem. Kody działają offline: kapitanowie zaznaczają karty sami i skanują nowe kody przy każdej grze.';
  return `<div class="ov"><div class="dlg" style="max-width:900px"><h2>Kody dla kapitanów</h2>
  <div class="qrs">${qrBox('r')}${qrBox('b')}</div>
  <p class="note">${note}</p>
  <div class="row"><button class="btn pri big" data-act="closeqr">Gotowe, zamknij</button></div></div></div>`;
}

/* ---------- widoki ---------- */
let lastId=null, lastRev=null, lastLeft=null, shakeNext=false;
const FIT_SEL='.card .front, .card .lab';

function cardHtml(i){
  const k=game.key[i], rev=game.revealed[i];
  const fresh = rev && lastId===game.id && lastRev && lastRev[i]===false && !calm();
  const showKey = !!game.winner && !ui.winHold;
  let cls='card'; if(rev) cls+=' rev k-'+k+(fresh?' flip'+(k==='a'?' slow':''):''); else if(showKey) cls+=' hint k-'+k;
  const w=esc(game.words[i]), hint=showKey&&!rev;
  const front=`<span class="face front">${hint?illus(k,'ghost'):''}<span class="w">${w}</span>${hint?`<span class="g">${GLYPH[k]}</span>`:''}</span>`;
  const back=rev?`<span class="face back">${illus(k)}<span class="lab">${w}</span><span class="g">${GLYPH[k]}</span></span>`:'';
  return `<button class="${cls}" data-act="card" data-i="${i}"><span class="in">${front}${back}</span></button>`;
}
/* licznik w stylu tablicy odlotów: przy zmianie klapka przeskakuje ze starej cyfry na nową */
function flapNum(o,n){
  const anim=o!==n && !calm();
  return `<span class="flap"><span class="h up"><b>${n}</b></span><span class="h dn"><b>${anim?o:n}</b></span>${anim?`<span class="h fu"><b>${o}</b></span><span class="h fd"><b>${n}</b></span>`:''}</span>`;
}
function fmtDur(ms){ const t=Math.max(0,Math.round(ms/1000)); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); }
const zeroCnt = t => t==='pair' ? [0,0] : 0;
const fmtCnt = (t,v) => t==='dur' ? fmtDur(v*1000) : t==='pair' ? v[0]+' / '+v[1] : String(v);
function runCounters(){
  const els=[...document.querySelectorAll('[data-cnt]')]; if(!els.length||!game) return;
  ui.statAnim=game.id;
  els.forEach(el=>{
    const c=JSON.parse(el.dataset.cnt); el.removeAttribute('data-cnt');
    const t0=Date.now()+c.d*1000, len=750;
    const iv=setInterval(()=>{
      if(!el.isConnected) return clearInterval(iv);
      const p=Math.min(1,Math.max(0,(Date.now()-t0)/len)), e=1-Math.pow(1-p,3);
      el.textContent=fmtCnt(c.t, c.t==='pair' ? c.v.map(x=>Math.round(x*e)) : Math.round(c.v*e));
      if(p>=1) clearInterval(iv);
    },30);
  });
}
function winDialog(){
  const w=game.winner, killer=game.lastKey==='a';
  const sc=config.score||{r:0,b:0}, target=config.match||0;
  const champ=target>0 && sc[w]>=target;
  const dur=(game.endedAt||Date.now())-game.id;
  const h=game.hits||{r:0,b:0}, m=game.miss||{r:0,b:0};
  // statystyki pojawiają się po kolei i liczą w górę (tylko przy pierwszym pokazaniu okna)
  const anim=ui.statAnim!==game.id && !calm();
  let si=0;
  const stat=(a,type,v)=>{ const d=+(.45+si++*.3).toFixed(2);
    return `<div class="stat${anim?' seq':''}" style="--d:${d}s">${a}<b${anim?` data-cnt='${JSON.stringify({t:type,v,d})}'`:''}>${fmtCnt(type,anim?zeroCnt(type):v)}</b></div>`; };
  const last=game.lastWord?(killer?`<p class="note">„${esc(game.lastWord)}” to zabójca – drużyna ${esc(tn(game.lastBy))} przegrywa.</p>`:`<p class="note">Ostatnie odkryte hasło: „${esc(game.lastWord)}” (${esc(tn(game.lastBy))})</p>`):'';
  return `<div class="ov"><div class="dlg wide"><div class="kicker">${champ?'🏆 Koniec meczu':killer?'☠ Zabójca odkryty':'Koniec rundy'}</div>
    <div class="win ${w}">${champ?'Mistrzowie:':'Zwycięstwo:'}<br>${esc(tn(w))}</div>${last}
    <div class="stats">${stat('Czas gry','dur',Math.max(0,Math.round(dur/1000)))}${stat('Liczba tur','int',game.turnCount||1)}${stat(esc(tn('r'))+': trafione / pudła','pair',[h.r||0,m.r||0])}${stat(esc(tn('b'))+': trafione / pudła','pair',[h.b||0,m.b||0])}</div>
    ${target?`<div class="scoreline${anim?' seq':''}" style="--d:${(.45+si*.3).toFixed(2)}s">${esc(tn('r'))} ${sc.r} : ${sc.b} ${esc(tn('b'))} <span class="note">(mecz do ${target})</span></div>`:''}
    <div class="row">${champ?'<button class="btn pri big" data-act="newmatch">Nowy mecz</button>':'<button class="btn pri big" data-act="newgame2">Następna runda</button>'}<button class="btn" data-act="closewin">Pokaż planszę</button></div></div></div>`;
}
function hostBoard(){
  if(!game) return `<div class="wait"><h1>Tajniacy</h1><p>Nie ma jeszcze rozpoczętej gry.</p><p><button class="btn pri big" data-act="setup">Ustawienia i start</button></p></div>`;
  const target=config.match||0, sc=config.score||{r:0,b:0};
  const pips=t=>target?`<div class="pips">${Array.from({length:target},(_,i)=>i<(sc[t]||0)?'●':'○').join('')}</div>`:'';
  const prev=lastLeft&&lastLeft.id===game.id?lastLeft:null;
  const now={id:game.id,r:left('r'),b:left('b')};
  if(prev && (prev.r!==now.r||prev.b!==now.b) && !calm()) setTimeout(()=>Snd.play('flap'),250);
  const tb=t=>{const c=captainOf(t); return `<div class="team ${t} ${game.turn===t&&!game.winner?'active':''}"><div><div class="nm">${esc(tn(t))}</div><div class="cp">${c?'Kapitan: '+esc(c.n):''}</div>${pips(t)}</div><div class="num">${flapNum(prev?prev[t]:now[t],now[t])}</div></div>`;};
  const na=game.key.filter(k=>k==='a').length;
  const live=!game.winner;
  Snd.tension(live && (left('r')<=2||left('b')<=2));
  const hidden=game.winner && ui.hideWin===game.id;
  let html=`<div class="top">${tb('r')}<div class="mid"><span class="badge ${game.turn}">Ruch: ${esc(tn(game.turn))}</span><button class="btn sm" data-act="endturn">Koniec tury</button>${target?`<span class="mt">Mecz do ${target} · ${sc.r||0} : ${sc.b||0}</span>`:''}${na>1?`<span class="mt">☠ Zabójców: ${na}</span>`:''}</div>${tb('b')}</div>
  <div class="board ${shakeNext?'shake':''}">${game.words.map((_,i)=>cardHtml(i)).join('')}</div>
  <div class="foot">${LOBBY_BTN}<button class="btn sm" data-act="newgame">Nowa gra</button><button class="btn sm" data-act="savegame">💾 ${game.saveId?'Zapisano':'Zapisz grę'}</button><button class="btn sm" data-act="saves">Zapisane gry</button><button class="btn sm" data-act="qr">Kody QR kapitanów</button><button class="btn sm" data-act="setup">Ustawienia</button>${hidden?'<button class="btn sm pri" data-act="showwin">Podsumowanie</button>':''}${netBadge()}</div>`;
  if(ui.qr) html+=qrOverlay();
  if(game.winner && !ui.winHold && !hidden) html+=winDialog();
  lastId=game.id; lastRev=game.revealed.slice(); lastLeft=now; shakeNext=false;
  return html;
}
function turnBanner(t,label){
  document.querySelectorAll('.tbanner').forEach(e=>e.remove());
  const d=document.createElement('div'); d.className='tbanner';
  const no=String((game&&game.turnCount)||1).padStart(3,'0');
  d.innerHTML=`<div class="folder"><div class="tab">AKTA NR ${no}</div><div class="sheet"><div class="hd">Ściśle tajne</div><div class="lb">${esc(label||'Tura drużyny')}</div><div class="fstamp ${t}">${esc(tn(t))}</div></div></div>`;
  document.body.appendChild(d);
  setTimeout(()=>Snd.play('stamp'),640); setTimeout(()=>d.remove(),2400);
}
async function assassinScene(i,actor){
  const el=document.querySelector(`.card[data-i="${i}"]`), r=el&&el.getBoundingClientRect();
  const cx=r?r.left+r.width/2:innerWidth/2, cy=r?r.top+r.height/2:innerHeight/2;
  Snd.hush(true); Snd.play('swell');
  const n=document.createElement('div'); n.className='noir';
  n.style.setProperty('--cx',cx+'px'); n.style.setProperty('--cy',cy+'px');
  document.body.appendChild(n);
  await new Promise(res=>setTimeout(res,950));
  Snd.play('shot');
  const bo=document.createElement('div'); bo.className='blackout'; document.body.appendChild(bo);
  const f=document.createElement('div'); f.className='flashred'; document.body.appendChild(f); setTimeout(()=>f.remove(),900);
  const word=game.words[i];
  await reveal(i,actor);
  bulletScar(cx,cy);
  const kw=document.createElement('div'); kw.className='kwrap';
  kw.innerHTML=`<div class="kcard">${illus('a')}<div class="lab">${esc(word)}</div><div class="kst">Zabójca</div></div>`;
  document.body.appendChild(kw); fitCards('.kcard .lab');
  setTimeout(()=>{ bo.classList.add('off'); n.classList.add('out'); setTimeout(()=>{ bo.remove(); n.remove(); },1500); },2000);
  setTimeout(()=>kw.remove(),2450);
}
function splashView(){
  const word='TAJNIACY'.split('').map((c,i)=>`<span style="animation-delay:${(i*.09).toFixed(2)}s">${c}</span>`).join('');
  const cont=game&&!game.winner, nSaves=loadSaves().length;
  return `<div class="splash">${LOBBY_BTN}<div class="logo">${word}</div><div class="stamp">ŚCIŚLE TAJNE</div>
  <p class="tag">Dwóch kapitanów zna prawdę. Reszta ma tylko podpowiedzi.</p>
  <div class="row" style="justify-content:center;margin-top:28px">${cont
    ?'<button class="btn pri big" data-act="enter">▶ Wróć do gry</button><button class="btn big" data-act="entersetup">Ustawienia</button>'
    :`<button class="btn pri big" data-act="entersetup">▶ Zaczynamy</button>${game?'<button class="btn big" data-act="enter">Pokaż planszę</button>':''}`}${nSaves?`<button class="btn big" data-act="saves">Zapisane gry (${nSaves})</button>`:''}<button class="btn big" data-act="duo">👥 Gra we dwoje</button></div></div>`;
}
function setupView(){
  const cats=parseWords(ui.draftText!=null?ui.draftText:(config.text==null?DEFAULT_TEXT:config.text));
  const sel=config.cats;
  const pl=config.players||[];
  const team=t=>pl.map((p,i)=>({p,i})).filter(x=>x.p.t===t).map(({p,i})=>`<span class="chip ${p.c?'cp':''}">${esc(p.n)}<button class="${p.c?'on':''}" title="Kapitan" data-act="cap" data-i="${i}">★</button><button title="Usuń" data-act="del" data-i="${i}">✕</button></span>`).join('')||'<i>pusto</i>';
  return `<div class="setup"><h1>Tajniacy – ustawienia</h1>
  <div class="panel"><h2>1. Gracze i kapitanowie</h2>
    <div class="row"><input type="text" id="pname" placeholder="Imię (może być kilka po przecinku)" style="flex:1;min-width:200px">
      <button class="btn r sm" data-act="add" data-t="r">+ ${esc(tn('r'))}</button><button class="btn b sm" data-act="add" data-t="b">+ ${esc(tn('b'))}</button></div>
    <div class="cols" style="margin-top:10px"><div class="tcol r"><h3>${esc(tn('r'))}</h3>${team('r')}</div><div class="tcol b"><h3>${esc(tn('b'))}</h3>${team('b')}</div></div>
    <div class="row"><button class="btn sm" data-act="rndteams">🎲 Wylosuj podział drużyn</button><button class="btn sm" data-act="rndcap">🎲 Wylosuj kapitanów</button></div>
    <div class="note">Kapitana wskazujesz gwiazdką ★ (ręcznie) albo losujesz przyciskiem.</div></div>
  <div class="panel"><h2>2. Drużyny, wygląd i tryb gry</h2>
    <div class="row"><label class="lbl">Drużyna 1 <input type="text" id="nr" maxlength="14" value="${esc(tn('r'))}" style="width:11em"></label>
      <label class="lbl">Drużyna 2 <input type="text" id="nb" maxlength="14" value="${esc(tn('b'))}" style="width:11em"></label></div>
    <div class="row">${PRESETS.map((p,i)=>`<button class="btn sm" data-act="preset" data-i="${i}">${p[0]} / ${p[1]}</button>`).join('')}</div>
    <div class="row"><span class="lbl">Motyw:</span>${THEMES.map(([id,nm])=>`<button class="btn sm ${(config.theme||'noir')===id?'pri':''}" data-act="theme" data-v="${id}">${nm}</button>`).join('')}</div>
    <div class="row"><span class="lbl">Tryb:</span><select id="matchsel">${[[0,'Pojedyncza gra'],[2,'Mecz do 2 wygranych'],[3,'Mecz do 3 wygranych'],[4,'Mecz do 4 wygranych']].map(([v,l])=>`<option value="${v}" ${(config.match||0)===v?'selected':''}>${l}</option>`).join('')}</select>
      <span class="lbl">Wynik: ${(config.score||{}).r||0} : ${(config.score||{}).b||0}</span><button class="btn sm" data-act="resetscore">Wyzeruj wynik</button></div>
    <div class="row"><span class="lbl">Zabójcy:</span><select id="asssel">${[1,2,3].map(v=>`<option value="${v}" ${assassinCount()===v?'selected':''}>${v===1?'1 (klasycznie)':v}</option>`).join('')}</select>
      <span class="note" style="margin:0">Karty: 9 / 8 / ${8-assassinCount()} neutralnych / ${assassinCount()} ☠ – od następnej gry.</span></div></div>
  <div class="panel"><h2>3. Kategorie haseł w tej grze</h2>
    <div class="cats">${cats.map(c=>`<label><input type="checkbox" data-act="cat" data-n="${esc(c.name)}" ${(!sel||sel.includes(c.name))?'checked':''}>${esc(c.name)} (${c.words.length})</label>`).join('')}</div>
    <div class="row"><button class="btn sm" data-act="catall">Zaznacz wszystkie</button></div></div>
  <div class="panel"><h2>4. Lista haseł</h2>
    <div class="note" style="margin:0 0 8px">Format: linia zaczynająca się od # to nazwa kategorii, pod nią hasła – jedno w linii albo po przecinku. Edytuj do woli.</div>
    <textarea id="wtext" spellcheck="false">${esc(ui.draftText!=null?ui.draftText:(config.text==null?DEFAULT_TEXT:config.text))}</textarea>
    <div class="row"><button class="btn sm pri" data-act="savewords">Zapisz hasła</button><button class="btn sm" data-act="resetwords">Przywróć domyślne</button></div></div>
  <div class="panel"><h2>Dźwięk</h2>
    <div class="row"><label class="lbl"><input type="checkbox" id="smus" ${Snd.st.m?'checked':''}> Muzyka</label><input type="range" id="vmus" min="0" max="1" step=".05" value="${Snd.st.mv}">
      <label class="lbl" style="margin-left:14px"><input type="checkbox" id="ssfx" ${Snd.st.s?'checked':''}> Efekty</label><input type="range" id="vsfx" min="0" max="1" step=".05" value="${Snd.st.sv}"></div></div>
  <div class="row" style="margin-top:18px"><button class="btn pri big" data-act="start">▶ Start nowej gry</button>${game?'<button class="btn" data-act="back">Wróć do planszy</button>':''}<button class="btn" data-act="saves">Zapisane gry</button>${LOBBY_BTN}</div></div>`;
}
function render(){
  document.body.dataset.theme=config.theme||'noir';
  if(!ui.loaded.config||!ui.loaded.game){ $app.innerHTML='<div class="wait">Ładowanie…</div>'; return; }
  if(ui.splash||!game||!game.winner||ui.screen!=='board') document.querySelectorAll('.scar').forEach(e=>e.remove());
  if(ui.splash){ $app.innerHTML=splashView(); return; }
  else if(ui.screen==='setup') { const y=window.scrollY; $app.innerHTML=setupView(); window.scrollTo(0,y); }
  else $app.innerHTML=hostBoard();
  fitCards(FIT_SEL);
  runCounters();
}
window.addEventListener('resize',()=>{ fitCards(FIT_SEL); document.querySelectorAll('.scar').forEach(e=>e.remove()); });

/* lekka paralaksa planszy i tła oraz podświetlenie karty pod kursorem (tylko mysz) */
let hovCard=null;
function unhover(){ if(!hovCard) return; hovCard.classList.remove('hov'); ['--rx','--ry','--gx','--gy'].forEach(p=>hovCard.style.removeProperty(p)); hovCard=null; }
document.addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse'||calm()) return;
  const x=e.clientX/innerWidth-.5, y=e.clientY/innerHeight-.5, root=document.documentElement.style;
  root.setProperty('--px',(-x*1.2).toFixed(3)+'vmin'); root.setProperty('--py',(-y*1.2).toFixed(3)+'vmin');
  const c=e.target.closest&&e.target.closest('.board .card');
  const ok=c && !c.classList.contains('rev') && game && !game.winner && !document.querySelector('.ov');
  if(hovCard && hovCard!==c) unhover();
  if(!ok){ unhover(); return; }
  hovCard=c;
  const r=c.getBoundingClientRect(), u=(e.clientX-r.left)/r.width, v=(e.clientY-r.top)/r.height;
  c.classList.add('hov');
  c.style.setProperty('--rx',((.5-v)*14).toFixed(2)+'deg'); c.style.setProperty('--ry',((u-.5)*14).toFixed(2)+'deg');
  c.style.setProperty('--gx',(u*100).toFixed(1)+'%'); c.style.setProperty('--gy',(v*100).toFixed(1)+'%');
});
document.documentElement.addEventListener('mouseleave',()=>unhover());
function syncDraft(){ const t=document.getElementById('wtext'); if(t) ui.draftText=t.value; }

/* ---------- zdarzenia ---------- */
document.addEventListener('input',e=>{ const id=e.target.id; if(id==='wtext') ui.draftText=e.target.value; else if(id==='vmus') Snd.setVol('m',+e.target.value); else if(id==='vsfx') Snd.setVol('s',+e.target.value); });
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='pname'){ const c=(config.players||[]); const nr=c.filter(p=>p.t==='r').length, nb=c.filter(p=>p.t==='b').length; addPlayers(nr<=nb?'r':'b'); }});
function addPlayers(t){
  const inp=document.getElementById('pname'); if(!inp) return;
  const names=inp.value.split(',').map(s=>s.trim()).filter(Boolean); if(!names.length) return;
  config.players=(config.players||[]).concat(names.map(n=>({n,t,c:false})));
  saveConfig(); render();
}
const acts={
  async card(d){
    if(!game||game.winner) return;
    const i=+d.i; if(game.revealed[i]) return;
    const actor = game.turn;
    if(await ask("Odkryć hasło „"+game.words[i]+"”?","Tak, odkryj")){ if(game.key[i]==='a') assassinScene(i,actor); else reveal(i,actor); }
  },
  async endturn(){ if(await ask("Zakończyć turę?","Tak")) endTurn(); },
  setup(){ ui.screen='setup'; render(); },
  back(){ syncDraft(); ui.screen='board'; render(); },
  async newgame(){ if(await ask("Rozpocząć nową grę?","Tak, nowa gra","Obecna plansza zostanie zastąpiona.")) newGame(); },
  newgame2(){ newGame(); },
  async savegame(){
    if(!game) return;
    const def=game.saveName||`${tn('r')} vs ${tn('b')}, ${new Date().toLocaleString('pl-PL',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})}`;
    const name=await askText(game.saveId?"Zapisz grę (zmień nazwę)":"Zapisz grę","Zapisz",def);
    if(name) saveGame(name.slice(0,40));
  },
  saves(){ savesDialog(); },
  async lobby(){
    const live=game&&!game.winner;
    const t=document.getElementById('wtext');
    const draft=t&&t.value!==(config.text==null?DEFAULT_TEXT:config.text);
    const info=[live?(game.saveId?`Gra „${game.saveName}” jest zapisana na liście zapisów.`:"Gra zostaje w pamięci – po powrocie kliknij „Wróć do gry”."):"",
                draft?"Niezapisane zmiany w liście haseł przepadną.":""].filter(Boolean).join(' ');
    if(await ask("Wyjść do lobby?","Tak, wyjdź",info)) location.href='/';
  },
  qr(){ ui.qr=true; render(); },
  closeqr(){ ui.qr=false; render(); if(game&&!game.winner&&!game.revealed.some(Boolean)){ Snd.play('turn'); turnBanner(game.turn,'Zaczynają'); } },
  closewin(){ ui.hideWin=game.id; render(); },
  showwin(){ ui.hideWin=null; render(); },
  duo(){ location.href="duo.html"; },
  enter(){ ui.splash=false; ui.screen='board'; Snd.unlock(); render(); },
  entersetup(){ ui.splash=false; ui.screen='setup'; Snd.unlock(); render(); },
  newmatch(){ config.score={r:0,b:0}; saveConfig(); newGame(); },
  resetscore(){ config.score={r:0,b:0}; saveConfig(); render(); },
  preset(d){ const p=PRESETS[+d.i]; config.names={r:p[0],b:p[1]}; saveConfig(); render(); },
  theme(d){ config.theme=d.v; saveConfig(); render(); },
  tmusic(){ Snd.unlock(); Snd.setMusic(!Snd.st.m); updateSndUi(); },
  tsfx(){ Snd.unlock(); Snd.setSfx(!Snd.st.s); updateSndUi(); if(Snd.st.s) Snd.play('turn'); },
  add(d){ addPlayers(d.t); },
  del(d){ config.players.splice(+d.i,1); saveConfig(); render(); },
  cap(d){ const p=config.players[+d.i]; const was=p.c; config.players.forEach(x=>{ if(x.t===p.t) x.c=false; }); p.c=!was; saveConfig(); render(); },
  rndteams(){ const names=shuffle(config.players||[]).map(p=>p.n); config.players=names.map((n,i)=>({n,t:i%2?'b':'r',c:false})); saveConfig(); render(); },
  rndcap(){ ['r','b'].forEach(t=>{ const m=config.players.filter(p=>p.t===t); m.forEach(p=>p.c=false); if(m.length) m[Math.floor(Math.random()*m.length)].c=true; }); saveConfig(); render(); },
  saveurl(){ const v=document.getElementById('burl').value.trim().split('#')[0]; config.baseUrl=v; saveConfig(); render(); },
  cat(d,el){
    const all=parseWords(ui.draftText!=null?ui.draftText:(config.text==null?DEFAULT_TEXT:config.text)).map(c=>c.name);
    let sel=config.cats||all.slice();
    if(el.checked){ if(!sel.includes(d.n)) sel.push(d.n); } else sel=sel.filter(x=>x!==d.n);
    config.cats=sel; saveConfig();
  },
  catall(){ config.cats=null; saveConfig(); render(); },
  savewords(){ syncDraft(); config.text=ui.draftText; config.cats=null; ui.draftText=null; saveConfig(); render(); toast("Zapisano hasła"); },
  resetwords(){ ui.draftText=null; config.text=null; config.cats=null; saveConfig(); render(); },
  async start(){ syncDraft(); if(ui.draftText!=null){ config.text=ui.draftText; ui.draftText=null; saveConfig(); } await newGame(); }
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el||el.type==='checkbox') return;
  const f=acts[el.dataset.act]; if(f) f(el.dataset,el);
});
document.addEventListener('change',e=>{
  const t=e.target, el=t.closest('[data-act="cat"]'); if(el) return acts.cat(el.dataset,el);
  const clean=v=>v.replace(/[<>|]/g,'').trim().slice(0,14);
  if(t.id==='nr'||t.id==='nb'){ config.names=config.names||{}; config.names[t.id==='nr'?'r':'b']=clean(t.value)||TEAMS[t.id==='nr'?'r':'b'].name; syncDraft(); saveConfig(); render(); }
  else if(t.id==='matchsel'){ config.match=+t.value; saveConfig(); render(); }
  else if(t.id==='asssel'){ config.assassins=+t.value; saveConfig(); render(); }
  else if(t.id==='smus'){ Snd.setMusic(t.checked); updateSndUi(); }
  else if(t.id==='ssfx'){ Snd.setSfx(t.checked); updateSndUi(); }
});
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>Snd.unlock()));
function updateSndUi(){ const m=document.getElementById('bmusic'), f=document.getElementById('bsfx'); if(m) m.classList.toggle('off',!Snd.st.m); if(f) f.classList.toggle('off',!Snd.st.s); }

/* ---------- start ---------- */
// Hasło obsługuje wspólne /auth.js z lobby PL3Y (repo egozaur.github.io).
(function init(){
  // jednorazowo: nowe domyślne ustawienia (motyw noir, muzyka 50%) także dla osób z zapisanymi ustawieniami
  try{
    if(!localStorage.getItem('tj_def_v2')){
      const d=JSON.parse(localStorage.getItem('tajniacy_v1')||'{}')||{};
      if(d.config){ d.config.theme='noir'; localStorage.setItem('tajniacy_v1',JSON.stringify(d)); }
      Snd.setVol('m',.5);
      localStorage.setItem('tj_def_v2','1');
    }
  }catch(e){}
  migrateSaves();
  store=makeLocalStore(); updateSndUi();
  store.sub('config',d=>{
    if(d){ config={ text:null, cats:null, players:[], baseUrl:"", names:{}, theme:"noir", match:0, assassins:1, score:{r:0,b:0}, ...d }; config.names=config.names||{}; config.score=config.score||{r:0,b:0}; }
    const first=!ui.loaded.config; ui.loaded.config=true;
    if(first || ui.screen!=='setup') render();
  });
  store.sub('game',d=>{
    if(d && game && JSON.stringify(d)===JSON.stringify(game) && ui.loaded.game) return;
    game=d; ui.loaded.game=true;
    if(ui.screen!=='setup') render();
  });
  // gra z listy zapisów aktualizuje swój zapis po każdym ruchu i zmianie wyniku
  store.sub('game',()=>syncSave());
  store.sub('config',()=>syncSave());
  // każda zmiana gry i nazw/motywu idzie do pokoju na serwerze (telefony kapitanów)
  store.sub('game',()=>pushRoom());
  store.sub('config',()=>pushRoom());
  if(Net.room) connectRoom();
  flushSaves().catch(()=>{});
  setTimeout(()=>{ if(!ui.loaded.config||!ui.loaded.game){ ui.loaded.config=ui.loaded.game=true; render(); } },10000);
})();
</script>
